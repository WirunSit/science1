# แหล่งข้อมูลเดียวของโครงสร้างรายวิชา: หน่วย บท เรื่อง ชั่วโมง ตัวชี้วัด ลิงก์คลิป และสถานี Web Lab
# ถ้อยคำและเลขตัวชี้วัด: ครูยืนยันแล้วว่าตรงกับคำอธิบายรายวิชาของโรงเรียน (2 พ.ย. 2569)

course:
  code: ว21102
  hours: 60
  hoursPerWeek: 3
  weeks: 20

indicators:
  verified: true
  source: หลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พ.ศ. 2551 (ฉบับปรับปรุง พ.ศ. 2560) — ครูยืนยันกับคำอธิบายรายวิชาของโรงเรียน
  items:
    - id: "ว 2.3 ม.1/1"
      text: วิเคราะห์ แปลความหมายข้อมูล และคำนวณปริมาณความร้อนที่ทำให้สสารเปลี่ยนอุณหภูมิและเปลี่ยนสถานะ โดยใช้สมการ Q = mcΔt และ Q = mL
    - id: "ว 2.3 ม.1/2"
      text: สร้างแบบจำลองที่อธิบายการขยายตัวหรือหดตัวของสสารเนื่องจากได้รับหรือสูญเสียความร้อน
    - id: "ว 2.3 ม.1/3"
      text: ตระหนักถึงประโยชน์ของความรู้ของการหดและขยายตัวของสสารเนื่องจากความร้อน โดยวิเคราะห์สถานการณ์ปัญหาและเสนอแนะวิธีการนำความรู้มาแก้ปัญหาในชีวิตประจำวัน
      attitude: true
    - id: "ว 2.3 ม.1/4"
      text: วิเคราะห์สถานการณ์การถ่ายโอนความร้อนและคำนวณปริมาณความร้อนที่ถ่ายโอนระหว่างสสารจนเกิดสมดุลความร้อนโดยใช้สมการ Q สูญเสีย = Q ได้รับ
    - id: "ว 2.3 ม.1/5"
      text: สร้างแบบจำลองที่อธิบายการถ่ายโอนความร้อนโดยการนำความร้อน การพาความร้อน การแผ่รังสีความร้อน
    - id: "ว 2.3 ม.1/6"
      text: ออกแบบ เลือกใช้ และสร้างอุปกรณ์เพื่อแก้ปัญหาในชีวิตประจำวันโดยใช้ความรู้เกี่ยวกับการถ่ายโอนความร้อน
    - id: "ว 3.2 ม.1/1"
      text: เปรียบเทียบประโยชน์ของบรรยากาศแต่ละชั้น โดยใช้ข้อมูลที่รวบรวมได้
    - id: "ว 3.2 ม.1/2"
      text: อธิบายปัจจัยที่มีผลต่อการเปลี่ยนแปลงองค์ประกอบของลมฟ้าอากาศ จากข้อมูลที่รวบรวมได้
    - id: "ว 3.2 ม.1/3"
      text: เปรียบเทียบกระบวนการเกิดพายุฝนฟ้าคะนองและพายุหมุนเขตร้อน และผลที่มีต่อสิ่งมีชีวิตและสิ่งแวดล้อม รวมทั้งนำเสนอแนวทางการปฏิบัติตนให้เหมาะสมและปลอดภัย
    - id: "ว 3.2 ม.1/4"
      text: อธิบายการพยากรณ์อากาศ และพยากรณ์อากาศอย่างง่ายจากข้อมูลที่รวบรวมได้
    - id: "ว 3.2 ม.1/5"
      text: ตระหนักถึงคุณค่าของการพยากรณ์อากาศ โดยนำเสนอแนวทางการปฏิบัติตนและการใช้ประโยชน์จากคำพยากรณ์อากาศ
      attitude: true
    - id: "ว 3.2 ม.1/6"
      text: อธิบายสถานการณ์และผลกระทบการเปลี่ยนแปลงภูมิอากาศโลกจากข้อมูลที่รวบรวมได้
    - id: "ว 3.2 ม.1/7"
      text: ตระหนักถึงผลกระทบของการเปลี่ยนแปลงภูมิอากาศโลก โดยนำเสนอแนวทางการปฏิบัติตนภายใต้การเปลี่ยนแปลงภูมิอากาศโลก
      attitude: true

