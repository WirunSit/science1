# เกณฑ์การประเมิน U5C1-L3-R (แผนข้อ 8.5, ม.1/3) — ใช้กับใบงาน U5C1-L3-P1 rubric 4 ระดับ 4 ด้าน
id: U5C1-L3-R
lesson: U5C1-L3
type: R
title: เกณฑ์การประเมิน การวิเคราะห์สถานการณ์ปัญหาและเสนอวิธีแก้
qr: clip

objectives:
  - ใช้ประเมินคำตอบแต่ละสถานการณ์ในใบงาน U5C1-L3-P1 ด้านละ 1–4 คะแนน (สถานการณ์ละ 16 คะแนน)

grid:
  caption: เกณฑ์การให้คะแนน
  widths: [1.4, 2, 2, 2, 2]
  rows:
    - [ด้าน, 4 ดีมาก, 3 ดี, 2 พอใช้, 1 ปรับปรุง]
    - [ระบุปัญหา, ระบุปัญหาได้ชัดเจนและครบ, ระบุปัญหาได้แต่ขาดรายละเอียดเล็กน้อย, ระบุปัญหาได้บางส่วน, ระบุปัญหาไม่ได้หรือไม่ตรงสถานการณ์]
    - [อธิบายด้วยการขยาย–หดตัว, อธิบายถูกต้อง เชื่อมกับแบบจำลองอนุภาค (ระยะห่างเปลี่ยน ขนาดอนุภาคเท่าเดิม), อธิบายถูกต้องแต่ไม่กล่าวถึงอนุภาค, อธิบายถูกบางส่วน หรือมีความเข้าใจคลาดเคลื่อนเล็กน้อย, อธิบายผิด เช่น อนุภาคขยายใหญ่ขึ้น หรือมวลเพิ่มขึ้น]
    - [วิธีแก้ทำได้จริง, วิธีแก้ทำได้จริง ปลอดภัย และสอดคล้องกับคำอธิบาย, วิธีแก้ทำได้จริงแต่ขาดรายละเอียดด้านความปลอดภัย, วิธีแก้ทำได้บางส่วนหรือไม่สอดคล้องกับคำอธิบาย, ไม่เสนอวิธีแก้หรือทำไม่ได้จริง]
    - [สื่อสารชัดเจน, เรียงลำดับ 3 ส่วนชัดเจน ใช้ศัพท์วิทยาศาสตร์ถูกต้อง, เรียงลำดับชัดเจน ใช้ศัพท์ผิดเล็กน้อย, เข้าใจได้แต่สับสนบางส่วน, อ่านแล้วไม่เข้าใจ]

rubric:
  - [ระดับคุณภาพ ต่อสถานการณ์ 14–16 ดีมาก · 11–13 ดี · 8–10 พอใช้ · ต่ำกว่า 8 ปรับปรุง, 16]
