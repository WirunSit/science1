# ใบงานสร้างแบบจำลอง U5C2-L2-P1 (แผนข้อ 9.2, ม.1/5) — วาดภาพพร้อมลูกศรอธิบายการถ่ายโอนความร้อน 3 แบบในสถานการณ์เดียว
# สถานการณ์เขียนขึ้นเองจากชีวิตประจำวันของนักเรียน
id: U5C2-L2-P1
lesson: U5C2-L2
type: P
title: ใบงาน สร้างแบบจำลองการถ่ายโอนความร้อน 3 แบบ
qr: clip

objectives:
  - สร้างแบบจำลอง (ภาพพร้อมลูกศร) อธิบายการนำความร้อน การพาความร้อน และการแผ่รังสีความร้อนในสถานการณ์เดียว
  - "ใช้ลูกศร 3 แบบ: ลูกศรเส้นทึบ = การนำความร้อน ลูกศรวน = การพาความร้อน ลูกศรเส้นประ = การแผ่รังสีความร้อน"

draw:
  caption: วาดแบบจำลอง เขียนชื่อการถ่ายโอนความร้อนกำกับลูกศรทุกเส้น
  columns: [สถานการณ์ที่ 1 ต้มน้ำในหม้ออะลูมิเนียมบนเตาถ่าน, สถานการณ์ที่ 2 นั่งผิงไฟรอบกองไฟตอนเช้า]
  rows: [ภาพ]
  heightCm: 8
  answers:
    - [ลูกศรเส้นทึบจากก้นหม้อผ่านเนื้อโลหะ และไปตามด้ามโลหะ ลูกศรวนในน้ำ (น้ำร้อนลอยขึ้นกลางหม้อ จมลงด้านข้าง) ลูกศรเส้นประจากถ่านไปที่หน้าคนยืนข้างเตา, ลูกศรเส้นประจากกองไฟไปที่ตัวคน (ร้อนที่หน้า) ลูกศรวนของอากาศร้อนลอยขึ้นเหนือกองไฟ ลูกศรเส้นทึบตามไม้ที่ใช้เขี่ยไฟ (ร้อนช้าเพราะไม้เป็นฉนวน)]

questions:
  - section: สถานการณ์ที่ 1 ต้มน้ำในหม้ออะลูมิเนียมบนเตาถ่าน
    q: ความร้อนจากถ่านผ่านก้นหม้อไปถึงน้ำด้วยการถ่ายโอนแบบใด อธิบายด้วยอนุภาค
    level: เข้าใจ
    lines: 2
    answer: การนำความร้อน อนุภาคของอะลูมิเนียมที่ก้นหม้อสั่นแรงขึ้นแล้วส่งต่อพลังงานให้อนุภาคข้างเคียงจนถึงผิวด้านใน
  - q: น้ำทั้งหม้อร้อนขึ้นทั่วถึงด้วยการถ่ายโอนแบบใด
    level: เข้าใจ
    lines: 2
    answer: การพาความร้อน น้ำที่ก้นร้อนขึ้นลอยขึ้น น้ำด้านบนที่เย็นกว่าจมลงแทนที่ เกิดการไหลวนจนร้อนทั่วหม้อ
  - q: ยืนข้างเตารู้สึกร้อนที่หน้า ทั้งที่ไม่ได้แตะเตา ความร้อนมาถึงหน้าด้วยการถ่ายโอนแบบใด
    level: เข้าใจ
    lines: 2
    answer: การแผ่รังสีความร้อน ถ่านที่ร้อนแผ่รังสีออกมาโดยไม่ต้องอาศัยตัวกลาง
  - section: สถานการณ์ที่ 2 นั่งผิงไฟรอบกองไฟตอนเช้า
    q: ทำไมนั่งข้างกองไฟจึงอุ่น แม้ลมพัดอากาศร้อนลอยขึ้นไปด้านบน
    level: วิเคราะห์
    lines: 2
    answer: ความร้อนส่วนใหญ่ที่ถึงตัวมาจากการแผ่รังสีจากกองไฟ ซึ่งไม่ต้องอาศัยอากาศเป็นตัวกลาง ส่วนอากาศร้อนลอยขึ้นด้วยการพาความร้อน
  - q: ใช้ไม้ยาวเขี่ยไฟปลอดภัยกว่าใช้เหล็กเส้น เพราะเหตุใด
    level: นำไปใช้
    lines: 2
    answer: ไม้เป็นฉนวนความร้อน ความร้อนนำไปถึงมือได้ช้ามาก ส่วนเหล็กเป็นตัวนำความร้อน มือจะร้อนเร็ว
  - section: สรุปเปรียบเทียบ
    q: การถ่ายโอนความร้อนแบบใดไม่ต้องอาศัยตัวกลาง และแบบใดที่อนุภาคของตัวกลางเคลื่อนที่ไปพร้อมกับความร้อน
    level: วิเคราะห์
    lines: 2
    answer: การแผ่รังสีความร้อนไม่ต้องอาศัยตัวกลาง การพาความร้อนอนุภาคของตัวกลางเคลื่อนที่ไปพร้อมความร้อน (การนำความร้อนอนุภาคสั่นอยู่กับที่)

rubric:
  - [ภาพแบบจำลองมีลูกศรครบ 3 แบบ ทิศทางถูกต้อง, 4]
  - [เขียนชื่อการถ่ายโอนความร้อนกำกับถูกต้อง, 2]
  - [ตอบคำถามถูกต้อง ข้อละ 1 คะแนน, 6]
