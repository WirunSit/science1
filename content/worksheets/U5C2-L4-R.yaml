# เกณฑ์การประเมิน U5C2-L4-R (แผนข้อ 9.4, ม.1/6) — โครงงาน STEM กล่องเก็บความเย็น rubric 4 ระดับ 5 ด้าน
id: U5C2-L4-R
lesson: U5C2-L4
type: R
title: เกณฑ์การประเมิน โครงงาน STEM กล่องเก็บความเย็น
qr: clip

objectives:
  - ใช้ประเมินสมุดออกแบบ U5C2-L4-A1 ชิ้นงาน และการนำเสนอ ด้านละ 1–4 คะแนน (รวม 20 คะแนน)

grid:
  caption: เกณฑ์การให้คะแนน
  widths: [1.4, 2, 2, 2, 2]
  rows:
    - [ด้าน, 4 ดีมาก, 3 ดี, 2 พอใช้, 1 ปรับปรุง]
    - [ใช้ความรู้การถ่ายโอนความร้อน, อธิบายการลดการนำ การพา และการแผ่รังสีถูกต้องครบ และเชื่อมกับวัสดุที่เลือกทุกชั้น, อธิบายถูกต้อง 2 แบบ หรือครบแต่เชื่อมกับวัสดุไม่ครบ, อธิบายได้ 1 แบบ หรือมีความเข้าใจคลาดเคลื่อนเล็กน้อย, อธิบายผิด เช่น กล่องสร้างความเย็นได้เอง]
    - [ออกแบบตามข้อจำกัด, ร่างแบบ 2 แบบพร้อมเหตุผล ชิ้นงานอยู่ในขนาดและงบที่กำหนดทุกข้อ, ร่างแบบ 2 แบบ ชิ้นงานเกินข้อจำกัด 1 ข้อเล็กน้อย, ร่างแบบ 1 แบบ หรือเกินข้อจำกัดหลายข้อ, ไม่มีภาพร่าง หรือไม่สนใจข้อจำกัด]
    - [ผลการทดสอบ, บันทึกผลครบทุกช่วงเวลา มีหน่วย เขียนกราฟถูกต้อง, บันทึกผลครบ กราฟผิดเล็กน้อย, บันทึกผลไม่ครบ หรือไม่มีกราฟ, ไม่ได้ทดสอบหรือไม่บันทึกผล]
    - [ปรับปรุงจากข้อมูล, ปรับปรุงโดยอ้างผลทดสอบ ทดสอบซ้ำ และเปรียบเทียบผลด้วยตัวเลข, ปรับปรุงโดยอ้างผลทดสอบ แต่ไม่ได้ทดสอบซ้ำ, ปรับปรุงโดยไม่อ้างผลทดสอบ, ไม่ได้ปรับปรุง]
    - [การนำเสนอ, นำเสนอครบ 4 ส่วน (แบบ เหตุผล ผล การปรับปรุง) ในเวลา ใช้ศัพท์ถูกต้อง ตอบคำถามได้, นำเสนอครบแต่ใช้ศัพท์ผิดเล็กน้อย, นำเสนอไม่ครบ หรือเกินเวลามาก, ไม่ได้นำเสนอ หรือฟังไม่เข้าใจ]

rubric:
  - [ระดับคุณภาพ 17–20 ดีมาก · 13–16 ดี · 9–12 พอใช้ · ต่ำกว่า 9 ปรับปรุง, 20]
