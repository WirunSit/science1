# ใบงานฝึกทักษะ U5C1-L2-P1 (แผนข้อ 8.2) — คำนวณ Q = mcΔt 3 ระดับ ระดับละ 4 ข้อ
# คำตอบทุกข้อคำนวณจากฟังก์ชันใน apps/shared/physics ผ่าน {calc:...} และค่า c จาก constants ({cv:...} = ตัวเลขอย่างเดียว)
# ข้อ 11 ใช้ค่า c ของอะลูมิเนียมซึ่งยัง verified:false — ครูตรวจกับหนังสือก่อนแจก
id: U5C1-L2-P1
lesson: U5C1-L2
type: P
title: ใบงาน คำนวณปริมาณความร้อน Q = mcΔt
qr: clip

objectives:
  - คำนวณปริมาณความร้อนที่ทำให้สารเปลี่ยนอุณหภูมิด้วยสมการ Q = mcΔt
  - แปลงหน่วยกรัมเป็นกิโลกรัม หาอุณหภูมิที่เปลี่ยนไป มวล หรือความจุความร้อนจำเพาะ อย่างรอบคอบ
  - "ใช้ c ของน้ำ = {c:water} ทุกข้อ ยกเว้นข้อที่บอกค่าอื่น แสดงวิธีทำ 3 ขั้น: เขียนสิ่งที่รู้ → แทนค่า → ตอบพร้อมหน่วย"

questions:
  - section: ระดับ 1 หาปริมาณความร้อน (มวลเป็นกิโลกรัม)
    q: น้ำ 2 kg อุณหภูมิเพิ่มจาก 20 °C เป็น 70 °C ได้รับความร้อนกี่จูล
    level: นำไปใช้
    lines: 2
    answer: "Δt = 70 − 20 = 50 °C, Q = 2 × {cv:water} × 50 = {calc:heatForTempChange:2:c.water:50|J}"
  - q: น้ำ 0.5 kg อุณหภูมิเพิ่มจาก 30 °C เป็น 40 °C ได้รับความร้อนกี่จูล
    level: นำไปใช้
    lines: 2
    answer: "Δt = 10 °C, Q = 0.5 × {cv:water} × 10 = {calc:heatForTempChange:0.5:c.water:10|J}"
  - q: น้ำ 1.5 kg อุณหภูมิเพิ่มขึ้น 4 °C ได้รับความร้อนกี่จูล
    level: นำไปใช้
    lines: 2
    answer: "Q = 1.5 × {cv:water} × 4 = {calc:heatForTempChange:1.5:c.water:4|J}"
  - q: น้ำ 0.25 kg อุณหภูมิเพิ่มจาก 25 °C เป็น 65 °C ได้รับความร้อนกี่จูล
    level: นำไปใช้
    lines: 2
    answer: "Δt = 40 °C, Q = 0.25 × {cv:water} × 40 = {calc:heatForTempChange:0.25:c.water:40|J}"

  - section: ระดับ 2 มวลเป็นกรัม และหาอุณหภูมิที่เปลี่ยนไป
    q: น้ำ 300 g อุณหภูมิเพิ่มจาก 20 °C เป็น 50 °C ได้รับความร้อนกี่จูล
    level: นำไปใช้
    lines: 2
    answer: "m = 300 g = 0.3 kg, Δt = 30 °C, Q = 0.3 × {cv:water} × 30 = {calc:heatForTempChange:0.3:c.water:30|J}"
  - q: น้ำ 150 g อุณหภูมิเพิ่มจาก 26 °C เป็น 34 °C ได้รับความร้อนกี่จูล
    level: นำไปใช้
    lines: 2
    answer: "m = 0.15 kg, Δt = 8 °C, Q = 0.15 × {cv:water} × 8 = {calc:heatForTempChange:0.15:c.water:8|J}"
  - q: น้ำ 0.2 kg ได้รับความร้อน 16,800 J อุณหภูมิเพิ่มขึ้นกี่องศาเซลเซียส
    level: นำไปใช้
    lines: 2
    answer: "Δt = Q ÷ (m × c) = 16,800 ÷ (0.2 × {cv:water}) = {calc:tempChangeFromHeat:16800:0.2:c.water|°C}"
  - q: น้ำ 400 g อุณหภูมิเริ่มต้น 25 °C ได้รับความร้อน 33,600 J อุณหภูมิสุดท้ายเป็นเท่าใด
    level: วิเคราะห์
    lines: 2
    answer: "m = 0.4 kg, Δt = 33,600 ÷ (0.4 × {cv:water}) = {calc:tempChangeFromHeat:33600:0.4:c.water|°C} อุณหภูมิสุดท้าย = 25 + 20 = 45 °C"

  - section: ระดับ 3 หามวล ความจุความร้อนจำเพาะ และเปรียบเทียบ 2 สาร
    q: ความร้อน 25,200 J ทำให้น้ำมีอุณหภูมิเพิ่มขึ้น 15 °C น้ำมีมวลกี่กรัม
    level: วิเคราะห์
    lines: 2
    answer: "m = Q ÷ (c × Δt) = 25,200 ÷ ({cv:water} × 15) = {calc:massFromHeat:25200:c.water:15|kg} = 400 g"
  - q: สารชนิดหนึ่ง 0.5 kg ได้รับความร้อน 9,000 J อุณหภูมิเพิ่มขึ้น 20 °C สารนี้มีความจุความร้อนจำเพาะเท่าใด
    level: วิเคราะห์
    lines: 2
    answer: "c = Q ÷ (m × Δt) = 9,000 ÷ (0.5 × 20) = {calc:specificHeatFromHeat:9000:0.5:20|J/(kg·°C)}"
  - q: "น้ำ 0.5 kg และอะลูมิเนียม 0.5 kg (c = {c:aluminium}) ได้รับความร้อน 12,600 J เท่ากัน สารใดอุณหภูมิเพิ่มขึ้นมากกว่า มากกว่ากี่องศาเซลเซียส"
    level: วิเคราะห์
    lines: 3
    answer: "น้ำ Δt = 12,600 ÷ (0.5 × {cv:water}) = {calc:tempChangeFromHeat:12600:0.5:c.water|°C} อะลูมิเนียม Δt = 12,600 ÷ (0.5 × {cv:aluminium}) = {calc:tempChangeFromHeat:12600:0.5:c.aluminium|°C} อะลูมิเนียมเพิ่มขึ้นมากกว่า 22 °C เพราะมีความจุความร้อนจำเพาะน้อยกว่า"
  - q: ในตาราง Heater Bench ของฉัน น้ำ 200 g ที่เวลา 90 s ได้รับความร้อน 12,600 J คำนวณอุณหภูมิของน้ำที่ 90 s แล้วเทียบกับตาราง (อุณหภูมิเริ่มต้น 25 °C)
    level: วิเคราะห์
    lines: 2
    answer: "Δt = 12,600 ÷ (0.2 × {cv:water}) = {calc:tempChangeFromHeat:12600:0.2:c.water|°C} อุณหภูมิ = 25 + 15 = 40 °C ตรงกับตาราง"

rubric:
  - [ระดับ 1 ข้อละ 1 คะแนน, 4]
  - [ระดับ 2 ข้อละ 1.5 คะแนน (แปลงหน่วยถูก 0.5), 6]
  - [ระดับ 3 ข้อละ 2.5 คะแนน (จัดสมการถูก 1), 10]
