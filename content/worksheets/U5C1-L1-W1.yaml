# ใบกิจกรรมประกอบ Web Lab U5C1-L1-W1 (แผนข้อ 6.1, 8.1) — ใช้คู่กับ Heat Lab สถานี 1 Particle Box
# answer: ข้อความในฉบับครูเท่านั้น; lines: จำนวนบรรทัดเขียนตอบในฉบับนักเรียน
id: U5C1-L1-W1
lesson: U5C1-L1
type: W
title: ใบกิจกรรม กล่องอนุภาค
qr: lab
labStation: particle-box

objectives:
  - สังเกตและอธิบายการจัดเรียงและการเคลื่อนที่ของอนุภาคในของแข็ง ของเหลว และแก๊ส
  - สร้างแบบจำลองอนุภาคของสสารในแต่ละสถานะที่อุณหภูมิต่ำและอุณหภูมิสูง

inquiry:
  - label: คำทำนายของฉัน (ก่อนเปิดแล็บ) อนุภาคของของแข็งอยู่นิ่งหรือเคลื่อนที่ และเมื่อได้รับความร้อนจะเปลี่ยนไปอย่างไร
    lines: 2
    answer: (คำทำนายของนักเรียน ไม่ให้คะแนนถูกผิด) ใช้เทียบกับผลในข้อ 1 ของคำถามท้ายกิจกรรม

procedure:
  - สแกน QR เปิด Heat Lab การทดลอง "แบบจำลองอนุภาคของสสารในแต่ละสถานะ"
  - 'ทำขั้นที่ 1 ในแล็บ: ดูอนุภาคในกล่องของแข็ง ของเหลว และแก๊ส แล้วเลือกบันทึกในตารางที่ 1 ของแล็บ (แตะ "🔎 ติดตาม" เพื่อดูเส้นทางของอนุภาค)'
  - ให้ความร้อน แล้วทำให้เย็นลง ตามที่แล็บบอก สังเกตความเร็วและขนาดของอนุภาค บันทึกในตารางที่ 2 ของแล็บ
  - คัดลอกผลจากตารางที่ 1 ของแล็บลงในตารางด้านล่าง แล้ววาดแบบจำลองอนุภาคลงในตารางวาดภาพ
  - ทำขั้นที่ 2–3 ในแล็บ (ตอบคำถาม 5 ข้อ) แล้วกด "ส่งคะแนนให้ครู"

table:
  caption: ตารางที่ 1 อนุภาคในแต่ละสถานะ (คัดลอกจากแล็บ)
  columns: [สถานะ, การจัดเรียงของอนุภาค, การเคลื่อนที่ของอนุภาค]
  rows: [ของแข็ง, ของเหลว, แก๊ส]

draw:
  caption: ตารางวาดภาพ แบบจำลองอนุภาค (วาดอนุภาคเป็นวงกลม ใช้ลูกศรแสดงการเคลื่อนที่ ลูกศรยาว = เร็ว)
  columns: [ของแข็ง, ของเหลว, แก๊ส]
  rows: [อุณหภูมิต่ำ, อุณหภูมิสูง]
  answers:
    - [วงกลมชิดกัน เรียงเป็นแถว ลูกศรสั้นแสดงการสั่น, วงกลมชิดกัน ไม่เป็นระเบียบ ลูกศรสั้น, วงกลมห่างกัน ลูกศรหลายทิศทาง]
    - [ขนาดวงกลมเท่าเดิม เรียงเหมือนเดิม ลูกศรยาวขึ้น, ขนาดเท่าเดิม ลูกศรยาวขึ้น, ขนาดเท่าเดิม ลูกศรยาวขึ้นทุกทิศทาง]

questions:
  - q: คำทำนายของฉันตรงกับสิ่งที่สังเกตในแล็บหรือไม่ ต่างกันตรงไหน
    level: เข้าใจ
    lines: 2
    answer: อนุภาคของของแข็งไม่ได้อยู่นิ่ง แต่สั่นอยู่กับที่ และเมื่อได้รับความร้อนจะสั่นเร็วขึ้น ขนาดเท่าเดิม (เทียบกับคำทำนายของนักเรียน)
  - q: ทำไมในภาพที่อุณหภูมิสูง ต้องวาดอนุภาคขนาดเท่าเดิม
    level: เข้าใจ
    lines: 2
    answer: เพราะเมื่อได้รับความร้อน อนุภาคเคลื่อนที่เร็วขึ้น แต่ขนาดของอนุภาคแต่ละลูกไม่เปลี่ยน (จากตารางที่ 2 ของแล็บ ขนาดอนุภาค = เท่าเดิม)
  - q: ใช้แบบจำลองอนุภาคอธิบายว่า ทำไมเปิดขวดน้ำหอมไว้สักพัก จึงได้กลิ่นทั่วห้อง
    level: นำไปใช้
    lines: 2
    answer: น้ำหอมระเหยเป็นแก๊ส อนุภาคของแก๊สอยู่ห่างกันและเคลื่อนที่อิสระทุกทิศทาง จึงเคลื่อนที่ไปทั่วห้องเอง
  - q: แบบจำลองในแล็บต่างจากสสารจริงอย่างไร (อ่านหมายเหตุในขั้นที่ 3 ของแล็บ)
    level: วิเคราะห์
    lines: 2
    answer: ของจริงอนุภาคเล็กมากจนมองไม่เห็นและมีจำนวนมหาศาล ความเร็วในภาพขยายให้เห็นชัดกว่าจริง และแบบจำลองไม่แสดงการเปลี่ยนสถานะ

conclusion:
  lines: 2
  answer: สสารประกอบด้วยอนุภาคที่เคลื่อนที่ตลอดเวลา ของแข็งอนุภาคชิดกันเป็นระเบียบสั่นอยู่กับที่ ของเหลวอนุภาคชิดกันเลื่อนผ่านกันได้ แก๊สอนุภาคห่างกันมากเคลื่อนที่อิสระ เมื่อได้รับความร้อนอนุภาคเคลื่อนที่เร็วขึ้นและอุณหภูมิสูงขึ้น โดยขนาดอนุภาคเท่าเดิม

rubric:
  - [บันทึกตารางที่ 1 ครบและถูกต้อง, 3]
  - [วาดแบบจำลองอนุภาคถูกต้องทั้ง 6 ช่อง (ขนาดเท่ากัน ต่างกันที่การจัดเรียงและลูกศร), 4]
  - [ตอบคำถามโดยใช้แบบจำลองอนุภาค, 3]
