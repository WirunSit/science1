# ใบกิจกรรมประกอบ Web Lab U5C1-L3-W1 (แผนข้อ 8.3) — ใช้คู่กับ Heat Lab สถานี 3 Expand It (ม.1/2)
id: U5C1-L3-W1
lesson: U5C1-L3
type: W
title: ใบกิจกรรม การขยายหรือหดตัวใน Heat Lab
qr: lab
labStation: expand-it

objectives:
  - สังเกตการขยายตัวและหดตัวของของแข็ง ของเหลว และแก๊สในแบบจำลอง
  - สร้างแบบจำลองอนุภาคอธิบายการขยายตัวและหดตัว

inquiry:
  - label: คำทำนายของฉัน เมื่อแท่งโลหะได้รับความร้อนแล้วยาวขึ้น อนุภาคของโลหะเปลี่ยนไปอย่างไร
    lines: 2
    answer: (คำทำนายของนักเรียน) เทียบกับภาพเมื่อกด ⚛ อนุภาค ในแล็บ ขนาดอนุภาคเท่าเดิม ระยะห่างเพิ่มขึ้น

procedure:
  - สแกน QR เปิด Heat Lab การทดลอง "ความร้อนกับการขยายหรือหดตัวของสสาร"
  - ทำทั้ง 5 ฉากตามที่แล็บบอก ให้ความร้อนแล้วทำให้เย็นลง สังเกต แล้วเลือกบันทึกในตารางของแล็บ
  - กด "⚛ อนุภาค" สังเกตระยะห่างและขนาดของอนุภาคเมื่อร้อนและเมื่อเย็น
  - คัดลอกผลลงตารางด้านล่าง แล้ววาดแบบจำลองอนุภาค
  - ทำขั้นที่ 2–3 ในแล็บ แล้วกด "ส่งคะแนนให้ครู"

table:
  caption: ตารางบันทึกผล (คัดลอกจากแล็บ)
  columns: [สิ่งที่สังเกต, เมื่อร้อนขึ้น, เมื่อเย็นลง]
  rows: [ลูกโลหะกับห่วง, แถบโลหะคู่, ช่องว่างที่รอยต่อราง, ระดับน้ำสีในหลอดแก้ว, ลูกโป่งบนปากขวด]

draw:
  caption: วาดแบบจำลองอนุภาคของลูกโลหะ (อนุภาคเป็นวงกลม ใช้ลูกศรแสดงการสั่น)
  columns: [ก่อนได้รับความร้อน, หลังได้รับความร้อน]
  rows: [อนุภาคของโลหะ]
  answers:
    - [วงกลมเรียงชิดกันเป็นระเบียบ ลูกศรสั้น, วงกลมขนาดเท่าเดิม เรียงเป็นระเบียบแต่ห่างกันขึ้นเล็กน้อย ลูกศรยาวขึ้น]

questions:
  - q: ลูกโลหะที่ร้อนขึ้นลอดห่วงไม่ได้ แต่เมื่อเย็นลงลอดได้ เพราะเหตุใด
    level: เข้าใจ
    lines: 2
    answer: เมื่อร้อน อนุภาคของโลหะสั่นมากขึ้นและอยู่ห่างกันขึ้น ลูกโลหะจึงขยายตัวใหญ่กว่าห่วง เมื่อเย็นลงจึงหดตัวกลับ
  - q: แถบโลหะคู่ทองเหลือง–เหล็ก โค้งเมื่อร้อนเพราะอะไร และโลหะใดอยู่ด้านนอกของส่วนโค้ง
    level: วิเคราะห์
    lines: 2
    answer: เพราะทองเหลืองขยายตัวมากกว่าเหล็ก แถบจึงโค้งไปทางเหล็ก ทองเหลืองอยู่ด้านนอกของส่วนโค้ง
  - q: เมื่อร้อนขึ้น ลูกโป่งพองขึ้นมาก แต่ลูกโลหะใหญ่ขึ้นน้อยมาก (ในของจริง) บอกอะไรเกี่ยวกับการขยายตัวของแก๊สกับของแข็ง
    level: วิเคราะห์
    lines: 2
    answer: แก๊สขยายตัวได้มากกว่าของแข็งมาก เพราะอนุภาคของแก๊สอยู่ห่างกันและไม่ยึดกัน
  - q: แบบจำลองในแล็บต่างจากของจริงอย่างไร (อ่านหมายเหตุในขั้นที่ 3 ของแล็บ)
    level: วิเคราะห์
    lines: 2
    answer: ภาพขยายการเปลี่ยนขนาดให้เห็นชัด ของจริงโลหะขยายตัวน้อยมาก

conclusion:
  lines: 2
  answer: สสารทุกสถานะขยายตัวเมื่อได้รับความร้อนและหดตัวเมื่อสูญเสียความร้อน เพราะระยะห่างระหว่างอนุภาคเปลี่ยน ขนาดอนุภาคและมวลเท่าเดิม สารต่างชนิดขยายตัวไม่เท่ากัน

rubric:
  - [บันทึกผลครบ 10 ช่องถูกต้อง, 3]
  - [วาดแบบจำลองอนุภาคถูกต้อง (ขนาดเท่าเดิม ระยะห่างเปลี่ยน), 4]
  - [ตอบคำถามโดยใช้ผลจากแล็บ, 3]
