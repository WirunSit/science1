# ใบกิจกรรมการทดลองจริง U5C2-L2-A1 (แผนข้อ 9.2) — ด่างทับทิมในน้ำ ให้ความร้อนด้านเดียว วาดทิศทางการไหลวน
id: U5C2-L2-A1
lesson: U5C2-L2
type: A
title: ใบกิจกรรม การพาความร้อนในน้ำ
qr: clip

objectives:
  - สังเกตการเคลื่อนที่ของน้ำเมื่อได้รับความร้อนที่ก้นภาชนะด้านเดียว
  - สร้างแบบจำลอง (วาดภาพพร้อมลูกศร) อธิบายการพาความร้อน

inquiry:
  - label: คำถามการทดลอง
    lines: 1
    answer: เมื่อให้ความร้อนที่ก้นบีกเกอร์ด้านหนึ่ง น้ำเคลื่อนที่อย่างไร
  - label: สมมติฐาน (ถ้า... ดังนั้น...)
    lines: 2
    answer: ถ้าน้ำที่ก้นได้รับความร้อน ดังนั้นน้ำส่วนนั้นจะลอยขึ้น และน้ำที่เย็นกว่าจะจมลงแทนที่ สีด่างทับทิมจะเคลื่อนเป็นวง

materials:
  - [บีกเกอร์ขนาด 250 mL, 1 ใบ]
  - [น้ำที่อุณหภูมิห้อง, 200 mL]
  - [เกล็ดด่างทับทิม (ครูแบ่งให้), 1–2 เกล็ด]
  - [ช้อนตักสารหรือหลอดดูด, 1 อัน]
  - [ชุดให้ความร้อนพร้อมขาตั้งและตะแกรง, 1 ชุด]

safety:
  - ด่างทับทิมย้อมผิวและเสื้อผ้า ห้ามจับด้วยมือ ใช้ช้อนตัก ใช้เพียง 1–2 เกล็ด
  - ห้ามจับบีกเกอร์และตะแกรงขณะร้อน ใช้ที่จับบีกเกอร์ทุกครั้ง
  - เททิ้งในที่ที่ครูกำหนด ล้างมือหลังทำกิจกรรม

procedure:
  - เทน้ำลงในบีกเกอร์ ตั้งบนตะแกรง วางให้นิ่ง 1 นาทีจนน้ำไม่กระเพื่อม
  - ค่อย ๆ หย่อนเกล็ดด่างทับทิมให้จมลงที่ก้นบีกเกอร์ชิดด้านใดด้านหนึ่ง
  - ให้ความร้อนเฉพาะใต้ตำแหน่งที่มีด่างทับทิม (ไฟอ่อน) สังเกตทิศทางที่สีเคลื่อนที่ 3–5 นาที
  - วาดภาพบีกเกอร์ ตำแหน่งแหล่งความร้อน และลูกศรแสดงทิศทางการไหลของสี

draw:
  caption: วาดแบบจำลองการพาความร้อน (ใช้ลูกศรสีแดงแทนน้ำที่ร้อนขึ้น ลูกศรสีน้ำเงินแทนน้ำที่เย็นกว่า)
  columns: [ก่อนให้ความร้อน, ให้ความร้อน 3–5 นาที]
  rows: [บีกเกอร์]
  answers:
    - [สีอยู่ที่ก้นบีกเกอร์ด้านเดียว ไม่เคลื่อนที่, สีลอยขึ้นเหนือแหล่งความร้อน ไปตามผิวน้ำด้านบน แล้วจมลงอีกด้าน เป็นวงวน]

questions:
  - q: สีด่างทับทิมเหนือแหล่งความร้อนเคลื่อนที่ไปทางใด แล้วไปที่ใดต่อ
    level: จำ/เข้าใจ
    lines: 2
    answer: ลอยขึ้นสู่ผิวน้ำ แล้วเคลื่อนไปอีกด้านของบีกเกอร์และจมลง เกิดการไหลวน
  - q: ทำไมน้ำที่ร้อนขึ้นจึงลอยขึ้น
    level: เข้าใจ
    lines: 2
    answer: น้ำที่ร้อนขึ้นขยายตัว ความหนาแน่นลดลง จึงลอยขึ้น น้ำที่เย็นกว่าหนาแน่นกว่าจึงจมลงแทนที่
  - q: '"ความร้อนลอยขึ้น" เป็นข้อความที่ถูกต้องหรือไม่ ควรแก้เป็นอย่างไร'
    level: วิเคราะห์
    lines: 2
    answer: ไม่ถูกต้อง ที่ถูกคือ ของไหล (น้ำหรืออากาศ) ที่ร้อนขึ้นลอยขึ้น และพาความร้อนไปด้วย

conclusion:
  lines: 2
  answer: น้ำที่ได้รับความร้อนลอยขึ้น น้ำที่เย็นกว่าจมลงแทนที่ เกิดการไหลวน ความร้อนถ่ายโอนไปพร้อมกับน้ำที่เคลื่อนที่ เรียกว่า การพาความร้อน

rubric:
  - [ตั้งสมมติฐานได้, 2]
  - [วาดแบบจำลองพร้อมลูกศรถูกต้อง, 4]
  - [ตอบคำถามโดยใช้ผลการทดลอง, 3]
  - [ปฏิบัติตามข้อควรระวังด้านความปลอดภัย, 1]
