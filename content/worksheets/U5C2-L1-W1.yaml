# ใบกิจกรรมประกอบ Web Lab U5C2-L1-W1 (แผนข้อ 9.1) — ใช้คู่กับ Heat Transfer Studio สถานี 1 การนำความร้อน
# ลำดับในแนวคำตอบตรงกับค่าที่แล็บคำนวณจากแบบจำลอง (apps/heat-transfer-studio/answers.ts)
id: U5C2-L1-W1
lesson: U5C2-L1
type: W
title: ใบกิจกรรม การนำความร้อนใน Heat Transfer Studio
qr: lab
labStation: conduction-rod

objectives:
  - เปรียบเทียบการนำความร้อนของทองแดง อะลูมิเนียม เหล็ก และไม้ จากแบบจำลอง
  - อธิบายการนำความร้อนด้วยแบบจำลองอนุภาค

procedure:
  - สแกน QR เปิด Heat Transfer Studio การทดลอง "การนำความร้อน"
  - กด "🔥 เริ่มให้ความร้อน" สังเกตสีของแท่งและเม็ดเทียนที่หลุด
  - เลือกบันทึกในตารางของแล็บตามที่ "ตอนนี้ให้ทำ" บอก แล้วคัดลอกลงตารางนี้
  - ทำขั้นที่ 2–3 ในแล็บ แล้วกด "ส่งคะแนนให้ครู"

table:
  caption: ตารางบันทึกผล (คัดลอกจากแล็บ)
  columns: [วัสดุ, ลำดับเทียนเม็ดแรกหลุด, ตัวนำ/ฉนวน]
  rows: [ทองแดง, อะลูมิเนียม, เหล็ก, ไม้]

draw:
  caption: วาดแบบจำลองอนุภาคในแท่งโลหะ (วงกลม = อนุภาค ลูกศรสั้น = สั่น ใช้ลูกศรยาวชี้ทางที่พลังงานส่งต่อ)
  columns: [ปลายที่จุ่มน้ำเดือด, ปลายอีกด้าน]
  rows: [อนุภาค]
  answers:
    - [อนุภาคขนาดเท่าเดิม อยู่ที่เดิม สั่นแรง (ลูกศรสั้นหลายอัน), อนุภาคสั่นน้อยกว่า ลูกศรยาวชี้จากปลายร้อนไปปลายเย็น]

questions:
  - q: แท่งใดนำความร้อนได้ดีที่สุด แท่งใดเป็นฉนวนความร้อน ใช้ข้อมูลใดในตารางตัดสิน
    level: เข้าใจ
    lines: 2
    answer: ทองแดงนำความร้อนได้ดีที่สุด (เทียนหลุดเป็นลำดับที่ 1) ไม้เป็นฉนวนความร้อน (เทียนไม่หลุด)
  - q: ระหว่างที่ความร้อนเคลื่อนจากปลายร้อนไปปลายเย็น อนุภาคของโลหะเคลื่อนที่ไปด้วยหรือไม่
    level: เข้าใจ
    lines: 2
    answer: ไม่เคลื่อนที่ไป อนุภาคสั่นอยู่กับที่แล้วส่งต่อพลังงานให้อนุภาคข้างเคียง
  - q: ตอนเช้าจับราวบันไดเหล็กรู้สึกเย็นกว่าราวไม้ ทั้งที่อยู่ในที่เดียวกัน อธิบายโดยใช้ผลจากแล็บ
    level: วิเคราะห์
    lines: 3
    answer: ราวทั้งสองมีอุณหภูมิเท่ากัน แต่เหล็กเป็นตัวนำความร้อน นำความร้อนออกจากมือได้เร็วกว่าไม้ มือเสียความร้อนเร็วจึงรู้สึกเย็น ไม่มีความเย็นไหลเข้ามือ

conclusion:
  lines: 2
  answer: การนำความร้อนเกิดจากอนุภาคสั่นแล้วส่งต่อพลังงาน โลหะนำความร้อนได้ดีแต่ไม่เท่ากัน (ทองแดง > อะลูมิเนียม > เหล็ก) ไม้เป็นฉนวนความร้อน

rubric:
  - [บันทึกผลครบถูกต้อง, 4]
  - [วาดแบบจำลองอนุภาคถูกต้อง, 2]
  - [ตอบคำถามโดยอ้างผลจากแล็บ, 4]
