# สมุดออกแบบ U5C2-L4-A1 (แผนข้อ 9.4, ม.1/6) — โครงงาน STEM กล่องเก็บความเย็น ไม่เกิน 4 หน้า
# เรียงตามขั้นตอนการออกแบบเชิงวิศวกรรม 6 ขั้น ⚠️ ครูตรวจถ้อยคำ 6 ขั้นกับเอกสาร สสวท. ที่โรงเรียนใช้
# ประเมินด้วย rubric U5C2-L4-R
id: U5C2-L4-A1
lesson: U5C2-L4
type: A
title: สมุดออกแบบ กล่องเก็บความเย็น
qr: lab
labStation: cool-box
drawFirst: true

objectives:
  - ออกแบบและสร้างกล่องเก็บความเย็นจากวัสดุเหลือใช้ ภายใต้ข้อจำกัดที่ครูกำหนด
  - ทดสอบ ประเมินผล และปรับปรุงแบบจากข้อมูล
  - "ชื่อกลุ่ม ........................................ สมาชิก ................................................................"

inquiry:
  - label: "ขั้นที่ 1 ระบุปัญหา: ปัญหาที่กลุ่มจะแก้คืออะไร"
    lines: 2
    answer: น้ำแข็งในกล่องละลายเร็ว ต้องการกล่องที่ทำให้น้ำแข็งก้อนเดียวกันละลายช้าที่สุด
  - label: "ขั้นที่ 1 ข้อจำกัด (ขนาด งบประมาณ เวลา วัสดุ ตามที่ครูกำหนด)"
    lines: 2
    answer: ตามที่ครูกำหนด เช่น ขนาดภายนอกไม่เกิน 25 × 25 × 25 cm งบไม่เกิน 50 บาท ใช้วัสดุเหลือใช้ มีฝาเปิดดูได้
  - label: "ขั้นที่ 2 รวบรวมข้อมูล: ความร้อนเข้ากล่องได้ 3 ทาง จะลดแต่ละทางอย่างไร"
    lines: 3
    answer: ลดการนำ ใช้ผนังที่เป็นฉนวน (โฟม ผ้า ช่องอากาศปิด) และหนาพอ / ลดการพา ปิดฝาสนิท อุดรูรั่ว / ลดการแผ่รังสี ผิวนอกสีขาวหรือหุ้มฟอยล์ วางในร่ม
  - label: "ขั้นที่ 2 ข้อมูลจากแล็บ ออกแบบกล่องเก็บความเย็น: แบบใดเก็บน้ำแข็งได้นานที่สุด กี่นาที"
    lines: 2
    answer: ตามที่กลุ่มทดสอบในแล็บ เช่น กระดาษลัง + โฟม 2 cm นานกว่ากระดาษลังชั้นเดียวหลายเท่า ฟอยล์ช่วยมากเมื่ออยู่กลางแดด

draw:
  caption: "ขั้นที่ 3 ออกแบบวิธีการแก้ปัญหา: ร่างแบบ 2 แบบ (ภาพตัดให้เห็นชั้นวัสดุ เขียนชื่อวัสดุแต่ละชั้น และเหตุผลใต้ภาพ)"
