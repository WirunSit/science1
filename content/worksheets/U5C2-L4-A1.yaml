questions:
  - section: ขั้นที่ 5 ประเมินผลและปรับปรุงแก้ไข
    q: จากกราฟ น้ำแข็งละลายเร็วที่สุดช่วงใด ความร้อนน่าจะเข้ากล่องทางใดมากที่สุด
    level: วิเคราะห์
    lines: 2
    answer: (ตามผลของกลุ่ม) เช่น ช่วงแรกละลายเร็ว ความร้อนเข้าทางรอยต่อฝา (การพา) หรือผนังบาง (การนำ)
  - q: กลุ่มปรับปรุงแบบอย่างไร ผลการทดสอบหลังปรับปรุงดีขึ้นหรือไม่ ใช้ข้อมูลในตารางยืนยัน
    level: วิเคราะห์
    lines: 3
    answer: (ตามผลของกลุ่ม) ระบุสิ่งที่เปลี่ยน เช่น เพิ่มโฟม อุดรอยต่อ หุ้มฟอยล์ และเทียบมวลน้ำแข็งที่เหลือที่เวลาเดียวกัน
  - section: ขั้นที่ 6 นำเสนอวิธีการแก้ปัญหา ผลการแก้ปัญหา หรือชิ้นงาน
    q: สรุปสิ่งที่จะนำเสนอ 3 นาที (แบบที่เลือก เหตุผล ผลทดสอบ การปรับปรุง)
    level: นำไปใช้
    lines: 4
    answer: นำเสนอครบ 4 ส่วน ใช้ศัพท์การนำ การพา การแผ่รังสีถูกต้อง อ้างตัวเลขจากผลทดสอบ
  - q: ถ้าจะใช้ความรู้นี้ทำกล่องเก็บความร้อนให้ข้าวกล่องอุ่นนาน ต้องเปลี่ยนแบบหรือไม่ เพราะเหตุใด
    level: นำไปใช้
    lines: 2
    answer: ใช้หลักเดียวกันได้ ฉนวนและผิวมันวาวลดการถ่ายโอนความร้อนทั้งเข้าและออก จึงเก็บความร้อนไว้ได้เช่นกัน

