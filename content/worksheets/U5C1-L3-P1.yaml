# ใบงานวิเคราะห์สถานการณ์ปัญหา U5C1-L3-P1 (แผนข้อ 8.3, ม.1/3) — ประเมินด้วย rubric U5C1-L3-R
# สถานการณ์เขียนขึ้นเองจากชีวิตประจำวันของนักเรียน
id: U5C1-L3-P1
lesson: U5C1-L3
type: P
title: ใบงาน วิเคราะห์สถานการณ์ปัญหาจากการขยายหรือหดตัว
qr: clip

objectives:
  - วิเคราะห์สถานการณ์ปัญหาที่เกิดจากการขยายหรือหดตัวของสสารเนื่องจากความร้อน
  - เสนอวิธีแก้ปัญหาที่ทำได้จริง และอธิบายด้วยความรู้เรื่องการขยายหรือหดตัว
  - "ทุกข้อตอบ 3 ส่วน: (1) ปัญหาคืออะไร (2) อธิบายด้วยการขยายหรือหดตัว (3) วิธีแก้ที่ทำได้จริง"

questions:
  - q: "สถานการณ์ที่ 1 ฝาเกลียวโลหะของขวดโหลแก้วใส่น้ำพริกปิดแน่นมาก ทุกคนในบ้านเปิดไม่ออก"
    level: นำไปใช้
    lines: 4
    answer: (1) ฝาแน่นเปิดไม่ได้ (2) โลหะขยายตัวมากกว่าแก้วเมื่อได้รับความร้อนเท่ากัน (3) ราดน้ำร้อนเฉพาะที่ฝาสักครู่ ฝาขยายตัวหลวมขึ้น แล้วใช้ผ้าจับหมุนเปิด
  - q: "สถานการณ์ที่ 2 แม่เทน้ำเดือดลงแก้วน้ำหนาที่เพิ่งออกจากตู้เย็นทันที แก้วร้าว"
    level: วิเคราะห์
    lines: 4
    answer: (1) แก้วร้าวเมื่อเทน้ำร้อน (2) ผิวด้านในร้อนขึ้นและขยายตัวทันที แต่ด้านนอกยังเย็นและขยายตัวน้อย แก้วจึงร้าว (3) อุ่นแก้วด้วยน้ำอุ่นก่อน หรือใช้แก้วทนความร้อน หรือใส่ช้อนโลหะไว้ในแก้วขณะเท
  - q: "สถานการณ์ที่ 3 สายไฟฟ้าระหว่างเสาไฟหน้าโรงเรียนหย่อนลงมากในตอนบ่ายที่อากาศร้อน และตึงในเช้าวันที่อากาศเย็น"
    level: วิเคราะห์
    lines: 4
    answer: (1) สายไฟหย่อนและตึงตามอุณหภูมิ (2) สายโลหะขยายตัวยาวขึ้นเมื่อร้อน หดสั้นลงเมื่อเย็น (3) ขึงสายให้หย่อนเผื่อไว้ เพื่อไม่ให้สายขาดเมื่อหดตัวตอนอากาศเย็น
  - q: "สถานการณ์ที่ 4 ลานคอนกรีตหน้าเสาธงของโรงเรียนเทเป็นแผ่นใหญ่แผ่นเดียว ผ่านไปหนึ่งปีมีรอยแตกหลายแห่ง"
    level: วิเคราะห์
    lines: 4
    answer: (1) ลานคอนกรีตแตก (2) คอนกรีตขยายตัวเมื่อแดดร้อนและหดตัวเมื่อเย็น แผ่นใหญ่ไม่มีที่ให้ขยายตัวจึงดันกันจนแตก (3) แบ่งเทเป็นแผ่นเล็ก ๆ และเว้นรอยต่อไว้ระหว่างแผ่น

rubric:
  - [ใช้เกณฑ์ U5C1-L3-R 4 ด้าน ด้านละ 1–4 คะแนน ต่อสถานการณ์, 16]
