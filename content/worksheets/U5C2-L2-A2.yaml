# ใบกิจกรรมการทดลองจริง U5C2-L2-A2 (แผนข้อ 9.2) — ขวดห่อกระดาษสีดำกับสีขาว วางกลางแดดหรือใต้หลอดไฟ
# ทดลองเฉพาะการดูดกลืนรังสี (ผลชัดและถูกต้อง) ส่วนการคายรังสีดูในแล็บ (D-046)
id: U5C2-L2-A2
lesson: U5C2-L2
type: A
title: ใบกิจกรรม สีของผิวกับการดูดกลืนรังสี
qr: clip

objectives:
  - ทดลองเปรียบเทียบการดูดกลืนรังสีของผิวสีดำกับผิวสีขาว
  - เขียนกราฟอุณหภูมิกับเวลาและแปลความหมายกราฟ

inquiry:
  - label: คำถามการทดลอง
    lines: 1
    answer: ขวดที่ผิวนอกสีต่างกัน เมื่อได้รับแสงเท่ากัน น้ำในขวดร้อนขึ้นเท่ากันหรือไม่
  - label: สมมติฐาน (ถ้า... ดังนั้น...)
    lines: 2
    answer: ถ้าผิวนอกของขวดเป็นสีดำ ดังนั้นจะดูดกลืนรังสีได้มากกว่า น้ำในขวดจะร้อนขึ้นมากกว่าขวดสีขาว
  - label: ตัวแปรต้น / ตัวแปรตาม
    lines: 1
    answer: ตัวแปรต้น สีของผิวขวด / ตัวแปรตาม อุณหภูมิของน้ำในขวด
  - label: ตัวแปรควบคุม
    lines: 1
    answer: ขนาดและชนิดขวด ปริมาณน้ำ อุณหภูมิเริ่มต้น ตำแหน่งที่วาง (ได้รับแสงเท่ากัน) เวลา

materials:
  - [ขวดพลาสติกใสขนาดเท่ากัน, 2 ขวด]
  - [กระดาษสีดำและกระดาษสีขาว พร้อมเทปกาว, อย่างละ 1 แผ่น]
  - [น้ำที่อุณหภูมิห้อง, 2 × 200 mL]
  - [เทอร์โมมิเตอร์, 2 อัน]
  - [ดินน้ำมันหรือฝาเจาะรู สำหรับยึดเทอร์โมมิเตอร์, 2 ชุด]
  - [นาฬิกาจับเวลา, 1 เครื่อง]

safety:
  - ถ้าใช้หลอดไฟแทนแสงแดด ห้ามจับหลอดไฟขณะเปิด หลอดไฟร้อนมาก
  - ห้ามมองดวงอาทิตย์โดยตรง
  - ระวังเทอร์โมมิเตอร์แตก ถ้าแตกให้แจ้งครูทันที

procedure:
  - ห่อขวดใบที่ 1 ด้วยกระดาษสีดำ ขวดใบที่ 2 ด้วยกระดาษสีขาว
  - ใส่น้ำขวดละ 200 mL เสียบเทอร์โมมิเตอร์ให้ปลายอยู่กลางน้ำ อ่านอุณหภูมิเริ่มต้น
  - วางขวดทั้งสองกลางแดด (หรือห่างหลอดไฟเท่ากัน) ไม่บังกัน
  - อ่านและบันทึกอุณหภูมิทุก 5 นาที จนครบ 20 นาที แล้วเขียนกราฟทั้งสองเส้นบนกระดาษกราฟเดียวกัน

table:
  caption: ตารางบันทึกผล อุณหภูมิของน้ำในขวด
  columns: [เวลา (min), ขวดสีดำ (°C), ขวดสีขาว (°C)]
  rows: ['0', '5', '10', '15', '20']

graph:
  x: เวลา (min)
  y: อุณหภูมิ (°C)

questions:
  - q: เมื่อครบ 20 นาที น้ำในขวดใดมีอุณหภูมิสูงกว่า สูงกว่ากี่องศาเซลเซียส
    level: จำ/เข้าใจ
    lines: 2
    answer: ขวดสีดำมีอุณหภูมิสูงกว่า (ค่าตามผลการทดลองของกลุ่ม)
  - q: ผิวสีดำและผิวสีขาวทำอะไรกับรังสีที่มาตกกระทบต่างกันอย่างไร
    level: เข้าใจ
    lines: 2
    answer: ผิวสีดำดูดกลืนรังสีได้มาก ผิวสีขาวสะท้อนรังสีออกไปมาก ดูดกลืนได้น้อย
  - q: ทำไมวันที่แดดร้อนจัดควรใส่เสื้อสีอ่อน และทาสีหลังคาบ้านสีขาวหรือสีเงิน
    level: นำไปใช้
    lines: 2
    answer: ผิวสีอ่อนหรือมันวาวสะท้อนรังสีจากดวงอาทิตย์ได้มาก ดูดกลืนน้อย ร่างกายและบ้านจึงร้อนน้อยกว่า

conclusion:
  lines: 2
  answer: ผิวสีดำดูดกลืนรังสีได้ดีกว่าผิวสีขาว น้ำในขวดสีดำจึงร้อนขึ้นมากกว่า ความร้อนจากแสงถ่ายโอนมาโดยการแผ่รังสี

rubric:
  - [ระบุตัวแปรถูกต้อง, 2]
  - [บันทึกผลครบ มีหน่วย และเขียนกราฟถูกต้อง, 3]
  - [ตอบคำถามโดยใช้ผลการทดลอง, 3]
  - [ปฏิบัติตามข้อควรระวังด้านความปลอดภัย, 2]
