# ใบกิจกรรมการทดลองจริง U5C1-L2-A1 (แผนข้อ 6.2, 8.2) — มวลน้ำ 100 g และ 200 g ตรงกับภารกิจใน Heat Lab
# answer: ข้อความในฉบับครูเท่านั้น; lines: จำนวนบรรทัดเขียนตอบในฉบับนักเรียน
id: U5C1-L2-A1
lesson: U5C1-L2
type: A
title: ใบกิจกรรมที่ 1 น้ำมวลต่างกันได้รับความร้อนเท่ากัน
qr: clip

objectives:
  - ทดลองและเปรียบเทียบอุณหภูมิที่เพิ่มขึ้นของน้ำมวลต่างกันเมื่อได้รับความร้อนจากแหล่งเดียวกัน
  - เขียนกราฟอุณหภูมิกับเวลาและแปลความหมายกราฟ

inquiry:
  - label: คำถามการทดลอง
    lines: 2
    answer: น้ำมวลต่างกันได้รับความร้อนจากแหล่งเดียวกันเป็นเวลาเท่ากัน จะมีอุณหภูมิเพิ่มขึ้นเท่ากันหรือไม่
  - label: สมมติฐาน (ถ้า... ดังนั้น...)
    lines: 2
    answer: ถ้าน้ำมีมวลมากขึ้น ดังนั้นเมื่อได้รับความร้อนเท่ากัน อุณหภูมิจะเพิ่มขึ้นน้อยลง
  - label: ตัวแปรต้น
    lines: 1
    answer: มวลของน้ำ
  - label: ตัวแปรตาม
    lines: 1
    answer: อุณหภูมิของน้ำที่เพิ่มขึ้น
  - label: ตัวแปรควบคุม
    lines: 1
    answer: แหล่งความร้อน (ชุดให้ความร้อนชุดเดิม) เวลาที่ให้ความร้อน ชนิดของภาชนะ อุณหภูมิเริ่มต้น

# ปรับตามอุปกรณ์ที่โรงเรียนมีจริง: เครื่องแก้ว ชุดให้ความร้อน เทอร์โมมิเตอร์
materials:
  - [บีกเกอร์ขนาด 250 mL, 2 ใบ]
  - [กระบอกตวงขนาด 100 mL, 1 ใบ]
  - [ชุดให้ความร้อนพร้อมขาตั้งและตะแกรง, 1 ชุด]
  - [เทอร์โมมิเตอร์, 1 อัน]
  - [แท่งแก้วคน, 1 อัน]
  - [นาฬิกาจับเวลา (ใช้โทรศัพท์ได้), 1 เครื่อง]
  - [น้ำ, 300 mL]

safety:
  - สวมแว่นตานิรภัย มัดผมและเก็บสายคล้องให้เรียบร้อย
  - ห้ามจับบีกเกอร์ ตะแกรง หรือขาตั้งขณะร้อน ใช้ที่จับหรือผ้าจับของร้อนทุกครั้ง
  - ถ้าใช้ตะเกียงแอลกอฮอล์ ห้ามเติมแอลกอฮอล์ขณะจุดไฟ ดับไฟด้วยการครอบฝา ห้ามเป่า
  - ห้ามใช้เทอร์โมมิเตอร์คนน้ำ ใช้แท่งแก้วคนแทน ถ้าเทอร์โมมิเตอร์แตกให้แจ้งครูทันที

procedure:
  - ตวงน้ำ 100 mL (มวลประมาณ 100 g) ใส่บีกเกอร์ใบที่ 1 วัดและบันทึกอุณหภูมิเริ่มต้น
  - ตั้งบีกเกอร์บนชุดให้ความร้อน เริ่มจับเวลา คนน้ำเบา ๆ และบันทึกอุณหภูมิทุก 1 นาที จนครบ 6 นาที
  - ยกบีกเกอร์ลงด้วยที่จับ รอให้ชุดให้ความร้อนกลับสู่สภาพเดิมตามที่ครูกำหนด
  - ทำซ้ำข้อ 1–3 กับน้ำ 200 mL (มวลประมาณ 200 g) โดยใช้ความร้อนระดับเท่าเดิม
  - เขียนกราฟอุณหภูมิกับเวลาของน้ำทั้งสองชุดบนกระดาษกราฟเดียวกัน

table:
  caption: ตารางบันทึกผล อุณหภูมิของน้ำเมื่อเวลาผ่านไป
  columns: [เวลา (min), อุณหภูมิน้ำ 100 g (°C), อุณหภูมิน้ำ 200 g (°C)]
  rows: ['0', '1', '2', '3', '4', '5', '6']

graph:
  x: เวลา (min)
  y: อุณหภูมิ (°C)

questions:
  - q: เมื่อเวลาผ่านไป 6 นาที น้ำมวลใดมีอุณหภูมิเพิ่มขึ้นมากกว่า เพิ่มขึ้นกี่องศาเซลเซียส
    level: จำ/เข้าใจ
    lines: 2
    answer: น้ำ 100 g มีอุณหภูมิเพิ่มขึ้นมากกว่า (ค่าตามผลการทดลองของกลุ่ม โดยประมาณเป็น 2 เท่าของน้ำ 200 g)
  - q: กราฟของน้ำทั้งสองชุดมีความชันต่างกันอย่างไร ความชันบอกอะไร
    level: วิเคราะห์
    lines: 2
    answer: กราฟของน้ำ 100 g ชันกว่า ความชันบอกอัตราการเพิ่มของอุณหภูมิ น้ำมวลน้อยอุณหภูมิเพิ่มเร็วกว่าเมื่อได้รับความร้อนอัตราเท่ากัน
  - q: ถ้าต้องการต้มน้ำให้เดือดเร็วขึ้นโดยใช้เตาเดิม ควรทำอย่างไร เพราะเหตุใด
    level: นำไปใช้
    lines: 2
    answer: ใช้น้ำปริมาณน้อยลงเท่าที่จำเป็น เพราะมวลน้อยใช้ความร้อนน้อยกว่าในการทำให้อุณหภูมิเพิ่มขึ้นเท่ากัน (Q = mcΔt)

conclusion:
  lines: 3
  answer: เมื่อได้รับความร้อนเท่ากัน น้ำที่มีมวลมากกว่าจะมีอุณหภูมิเพิ่มขึ้นน้อยกว่า ปริมาณความร้อนที่ทำให้สารเปลี่ยนอุณหภูมิจึงขึ้นกับมวลของสาร

rubric:
  - [ตั้งสมมติฐานและระบุตัวแปรถูกต้อง, 3]
  - [บันทึกผลครบ มีหน่วย และเขียนกราฟถูกต้อง, 3]
  - [ตอบคำถามท้ายกิจกรรมโดยใช้ข้อมูลจากการทดลอง, 3]
  - [ปฏิบัติตามข้อควรระวังด้านความปลอดภัย, 1]
