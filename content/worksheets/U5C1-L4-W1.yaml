# ใบกิจกรรมประกอบ Web Lab U5C1-L4-W1 (แผนข้อ 8.4) — ทำนายกราฟก่อน แล้วเทียบกับ Heat Lab สถานี 4 Phase Graph
id: U5C1-L4-W1
lesson: U5C1-L4
type: W
title: ใบกิจกรรม ทำนายและอ่านกราฟการเปลี่ยนสถานะ
qr: lab
labStation: phase-graph

objectives:
  - ทำนายรูปกราฟอุณหภูมิกับเวลาของน้ำแข็งที่ได้รับความร้อนจนเป็นไอน้ำ แล้วเปรียบเทียบกับผลในแบบจำลอง
  - ระบุสถานะของสารและการเปลี่ยนอุณหภูมิในแต่ละช่วงของกราฟ

procedure:
  - ก่อนเปิดแล็บ ร่างกราฟที่ทำนายลงในกระดาษกราฟ (ใช้ดินสอ)
  - สแกน QR เปิด Heat Lab การทดลอง "ความร้อนกับการเปลี่ยนสถานะของสสาร"
  - กดเปิดเครื่อง ดูกราฟและบีกเกอร์ เมื่อแบบจำลองหยุด ให้เลือกบันทึกสารในภาชนะและอุณหภูมิ ทั้ง 5 ช่วง
  - คัดลอกผลลงตาราง แล้ววาดกราฟจากแล็บทับกราฟที่ทำนายด้วยปากกาอีกสี
  - ทำขั้นที่ 2–3 ในแล็บ แล้วกด "ส่งคะแนนให้ครู"

table:
  caption: ตารางบันทึกผล (คัดลอกจากแล็บ)
  columns: [ช่วง, สารในภาชนะ, อุณหภูมิ]
  rows: [ช่วงที่ 1, ช่วงที่ 2, ช่วงที่ 3, ช่วงที่ 4, ช่วงที่ 5]

graph:
  x: เวลา (s)
  y: อุณหภูมิ (°C)

questions:
  - q: กราฟที่ทำนายตรงกับกราฟในแล็บหรือไม่ ต่างกันตรงไหน
    level: เข้าใจ
    lines: 2
    answer: (ตามคำทำนายของนักเรียน) กราฟในแล็บมีเส้นราบ 2 ช่วงที่ 0 °C และ 100 °C ส่วนช่วงอื่นอุณหภูมิเพิ่มขึ้น
  - q: ช่วงที่ 4 ใช้เวลานานกว่าช่วงที่ 2 มาก ทั้งที่เครื่องให้ความร้อนอัตราเท่ากัน เพราะเหตุใด
    level: วิเคราะห์
    lines: 2
    answer: การเปลี่ยนน้ำเป็นไอน้ำใช้ความร้อนแฝงมากกว่าการเปลี่ยนน้ำแข็งเป็นน้ำหลายเท่า (L_v มากกว่า L_f)
  - q: หลังบันทึกครบ กด "❄ ทำให้เย็นลง" สังเกตกราฟ เส้นราบยังอยู่ที่อุณหภูมิเดิมหรือไม่ ตอนนี้สารรับหรือคายความร้อน
    level: วิเคราะห์
    lines: 2
    answer: เส้นราบอยู่ที่ 100 °C (ควบแน่น) และ 0 °C (แข็งตัว) เหมือนเดิม ตอนนี้สารคายความร้อนแฝงออกมา

conclusion:
  lines: 2
  answer: ขณะเปลี่ยนสถานะ อุณหภูมิคงที่ ความร้อนที่ได้รับหรือคายออกเป็นความร้อนแฝง การกลายเป็นไอใช้ความร้อนแฝงมากกว่าการหลอมเหลว

rubric:
  - [ร่างกราฟทำนายก่อนเปิดแล็บ, 2]
  - [บันทึกผลครบและวาดกราฟจากแล็บถูกต้อง, 4]
  - [ตอบคำถามโดยอ้างกราฟ, 4]
