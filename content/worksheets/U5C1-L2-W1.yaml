# ใบกิจกรรมประกอบ Web Lab U5C1-L2-W1 (แผนข้อ 6.1, 8.2) — ใช้คู่กับ Heat Lab สถานี 2 Heater Bench
# ตัวเลขในแนวคำตอบคือค่าในตารางของแล็บ (แถวน้ำลงตัว) แถวน้ำมันพืชขึ้นกับค่า c ที่รอครูยืนยัน จึงไม่ใส่ตัวเลข
id: U5C1-L2-W1
lesson: U5C1-L2
type: W
title: ใบกิจกรรม เครื่องให้ความร้อน
qr: lab
labStation: heater-bench

objectives:
  - เปรียบเทียบอุณหภูมิที่เพิ่มขึ้นของสารเมื่อได้รับความร้อนเท่ากัน โดยเปลี่ยนมวล และเปลี่ยนชนิดของสาร
  - เขียนกราฟอุณหภูมิกับเวลาจากตารางบันทึกผล และแปลความหมายความชันของกราฟ

inquiry:
  - label: คำถามการทดลอง
    lines: 2
    answer: เมื่อได้รับความร้อนเท่ากัน มวลและชนิดของสารมีผลต่ออุณหภูมิที่เพิ่มขึ้นหรือไม่ อย่างไร
  - label: สมมติฐาน (ถ้า... ดังนั้น...)
    lines: 2
    answer: ถ้าสารมีมวลมากขึ้น ดังนั้นอุณหภูมิจะเพิ่มขึ้นน้อยลง และถ้าเปลี่ยนชนิดของสาร อุณหภูมิจะเพิ่มขึ้นไม่เท่าเดิม
  - label: "ชุดที่ 1 (น้ำ 100 g กับน้ำ 200 g) ตัวแปรต้น / ตัวแปรตาม / ตัวแปรควบคุม"
    lines: 2
    answer: ต้น = มวลของน้ำ / ตาม = อุณหภูมิที่เพิ่มขึ้น / ควบคุม = ชนิดของสาร (น้ำ) อุณหภูมิเริ่มต้น เครื่องให้ความร้อน เวลา
  - label: "ชุดที่ 2 (น้ำ 100 g กับน้ำมันพืช 100 g) ตัวแปรต้น / ตัวแปรตาม / ตัวแปรควบคุม"
    lines: 2
    answer: ต้น = ชนิดของสาร / ตาม = อุณหภูมิที่เพิ่มขึ้น / ควบคุม = มวล (100 g) อุณหภูมิเริ่มต้น เครื่องให้ความร้อน เวลา

procedure:
  - สแกน QR เปิด Heat Lab การทดลอง "ความร้อนกับการเปลี่ยนอุณหภูมิของสสาร"
  - ทำภารกิจ 3 ครั้งในลำดับใดก็ได้ — น้ำ 100 g, น้ำ 200 g, น้ำมันพืช 100 g — โดยแตะขวดเพื่อเท เปิดเครื่อง แล้วอ่านช่องขยายและเลือกค่าในตารางทุก 30 วินาที
  - คัดลอกตารางบันทึกผลจากแล็บลงในตารางด้านล่าง
  - เขียนกราฟของทั้ง 3 ครั้งบนกระดาษกราฟเดียวกัน (ใช้สัญลักษณ์ต่างกัน) แล้วเทียบกับกราฟในแล็บ
  - ทำขั้นที่ 2–3 ในแล็บ (ตอบคำถาม 5 ข้อ) แล้วกด "ส่งคะแนนให้ครู"

table:
  caption: ตารางบันทึกผล อุณหภูมิ (°C) (คัดลอกจากแล็บ)
  columns: [เวลา (s), ความร้อน (J), น้ำ 100 g, น้ำ 200 g, น้ำมันพืช 100 g]
  rows: ['0', '30', '60', '90', '120']

graph:
  x: เวลา (s)
  y: อุณหภูมิ (°C)

questions:
  - q: ที่เวลา 120 s น้ำ 100 g และน้ำ 200 g มีอุณหภูมิเพิ่มขึ้นกี่องศาเซลเซียส ทั้งที่ได้รับความร้อนเท่ากัน
    level: จำ/เข้าใจ
    lines: 2
    answer: น้ำ 100 g เพิ่มขึ้น 65 − 25 = 40 °C น้ำ 200 g เพิ่มขึ้น 45 − 25 = 20 °C ทั้งสองได้รับความร้อน 16,800 J เท่ากัน
  - q: กราฟของการทดลองใดชันที่สุด และชันน้อยที่สุด ความชันบอกอะไร
    level: วิเคราะห์
    lines: 2
    answer: น้ำมันพืช 100 g ชันที่สุด น้ำ 200 g ชันน้อยที่สุด ความชันบอกว่าอุณหภูมิเพิ่มขึ้นเร็วเพียงใดเมื่อได้รับความร้อนในอัตราเท่ากัน
  - q: ทำไมน้ำมันพืช 100 g จึงร้อนเร็วกว่าน้ำ 100 g ทั้งที่มวลเท่ากันและได้รับความร้อนเท่ากัน
    level: วิเคราะห์
    lines: 2
    answer: เพราะน้ำมันพืชมีความจุความร้อนจำเพาะน้อยกว่าน้ำ จึงใช้ความร้อนน้อยกว่าในการทำให้อุณหภูมิเพิ่มขึ้นเท่ากัน
  - q: ถ้าทำการทดลองนี้จริงในห้องปฏิบัติการ อุณหภูมิจะเพิ่มขึ้นเท่ากับในแล็บหรือไม่ เพราะเหตุใด
    level: นำไปใช้
    lines: 2
    answer: น้อยกว่าในแล็บ เพราะในการทดลองจริงมีความร้อนบางส่วนสูญเสียไปกับบีกเกอร์และอากาศรอบ ๆ (ตามหมายเหตุของแบบจำลอง)

conclusion:
  lines: 3
  answer: เมื่อได้รับความร้อนเท่ากัน สารที่มีมวลมากกว่ามีอุณหภูมิเพิ่มขึ้นน้อยกว่า และสารต่างชนิดกันที่มีมวลเท่ากันมีอุณหภูมิเพิ่มขึ้นไม่เท่ากันเพราะมีความจุความร้อนจำเพาะต่างกัน ปริมาณความร้อนที่ทำให้สารเปลี่ยนอุณหภูมิจึงขึ้นกับมวล ชนิดของสาร และอุณหภูมิที่เปลี่ยนไป

rubric:
  - [ระบุคำถาม สมมติฐาน และตัวแปรทั้ง 2 ชุดถูกต้อง, 3]
  - [คัดลอกตารางครบ และเขียนกราฟ 3 เส้นถูกต้อง มีชื่อแกนและหน่วย, 4]
  - [ตอบคำถามโดยอ้างข้อมูลจากตารางและกราฟ, 3]
