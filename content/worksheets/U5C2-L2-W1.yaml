# ใบกิจกรรมประกอบ Web Lab U5C2-L2-W1 (แผนข้อ 9.2) — Heat Transfer Studio สถานี 2 การพาความร้อน และสถานี 3 การแผ่รังสีความร้อน
# คำตอบในตารางตรงกับค่าที่แล็บคำนวณ (apps/heat-transfer-studio/answers.ts) การคายรังสีบันทึกเป็นเร็ว/ช้า (D-046)
id: U5C2-L2-W1
lesson: U5C2-L2
type: W
title: ใบกิจกรรม การพาความร้อนและการแผ่รังสีใน Heat Transfer Studio
qr: lab
labStation: convection-pot

objectives:
  - เปรียบเทียบการไหลของน้ำเมื่อให้ความร้อนที่ก้นภาชนะกับที่ผิวน้ำด้านบน
  - เปรียบเทียบการดูดกลืนและการคายรังสีความร้อนของผิวต่างกัน

procedure:
  - สแกน QR เปิด Heat Transfer Studio ทำการทดลอง "การพาความร้อน" จนบันทึกครบ แล้วคัดลอกลงตารางที่ 1
  - กลับไปหน้ารายการ เปิด "การแผ่รังสีความร้อน" ทำจนบันทึกครบ แล้วคัดลอกลงตารางที่ 2
  - ทำขั้นที่ 2–3 ของทั้งสองการทดลอง แล้วกด "ส่งคะแนนให้ครู"

table:
  caption: ตารางที่ 1 การพาความร้อน (คัดลอกจากแล็บ)
  columns: [การทดลอง, น้ำที่ร้อนขึ้น, สีย้อม]
  rows: [ให้ความร้อนที่ก้นภาชนะ, ให้ความร้อนที่ผิวน้ำด้านบน]

tables:
  - caption: ตารางที่ 2 การแผ่รังสีความร้อน (คัดลอกจากแล็บ)
    columns: [ผิวกระป๋อง, "เปิดไฟ: ร้อนขึ้นลำดับที่", "ปิดไฟ: เย็นลง"]
    rows: [ดำด้าน, แดง, ขาว, เงินขัดเงา]

questions:
  - q: ให้ความร้อนที่ก้นภาชนะ สีย้อมหมุนวนทั่วภาชนะ แต่ให้ความร้อนด้านบน สีย้อมแทบไม่เคลื่อนที่ เพราะเหตุใด
    level: วิเคราะห์
    lines: 2
    answer: น้ำร้อนลอยขึ้น เมื่อให้ความร้อนที่ก้น น้ำร้อนลอยขึ้นและน้ำเย็นจมลงแทนที่จึงเกิดการไหลวน เมื่อให้ความร้อนด้านบน น้ำร้อนอยู่ด้านบนอยู่แล้ว จึงไม่เกิดการไหลวน
  - q: เมื่อเปิดไฟ กระป๋องใดร้อนขึ้นมากที่สุดและน้อยที่สุด เพราะเหตุใด
    level: เข้าใจ
    lines: 2
    answer: ดำด้านร้อนขึ้นมากที่สุด เพราะดูดกลืนรังสีได้มาก เงินขัดเงาร้อนขึ้นน้อยที่สุด เพราะสะท้อนรังสีออกไปมาก
  - q: เมื่อใส่น้ำร้อนแล้วปิดไฟ กระป๋องที่ทาสีทุกใบเย็นลงเร็วพอ ๆ กัน แต่กระป๋องเงินขัดเงาเย็นลงช้า กระติกน้ำร้อนจึงเคลือบผิวด้านในให้มันวาว เพราะเหตุใด
    level: นำไปใช้
    lines: 3
    answer: ผิวมันวาวคายรังสีความร้อนได้น้อยและสะท้อนรังสีกลับเข้าไป ความร้อนของน้ำจึงออกไปทางการแผ่รังสีได้น้อย น้ำร้อนอยู่ได้นาน

conclusion:
  lines: 2
  answer: การพาความร้อนเกิดในของไหล ของไหลที่ร้อนลอยขึ้น ส่วนที่เย็นจมลง การแผ่รังสีไม่ต้องอาศัยตัวกลาง ผิวดำด้านดูดกลืนรังสีได้ดี ผิวมันวาวสะท้อนรังสีได้ดีและคายรังสีได้น้อย

rubric:
