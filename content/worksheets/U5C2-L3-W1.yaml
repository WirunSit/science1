# ใบกิจกรรมประกอบ Web Lab U5C2-L3-W1 (แผนข้อ 9.3) — Heat Transfer Studio สถานี 4 สมดุลความร้อน
# ค่าในแนวคำตอบคำนวณจาก constants ผ่าน {calc:mixTwo:...} (การผสมที่ 3 ใช้ c ของเหล็ก ซึ่งยัง verified:false)
id: U5C2-L3-W1
lesson: U5C2-L3
type: W
title: ใบกิจกรรม สมดุลความร้อนใน Heat Transfer Studio
qr: lab
labStation: thermal-mixer

objectives:
  - สังเกตอุณหภูมิของสาร 2 ชนิดที่เข้าหากันจนเกิดสมดุลความร้อน
  - ตรวจผลจากแล็บด้วยการคำนวณ Q สูญเสีย = Q ได้รับ

procedure:
  - สแกน QR เปิด Heat Transfer Studio การทดลอง "สมดุลความร้อน"
  - กด "🫗 เทผสม" ดูกราฟอุณหภูมิของ A และ B และแถบ Q สูญเสีย กับ Q ได้รับ
  - เลือกบันทึกในตารางของแล็บครบ 3 การผสม แล้วคัดลอกลงตารางนี้
  - ทำขั้นที่ 2–3 ในแล็บ แล้วกด "ส่งคะแนนให้ครู"

table:
  caption: ตารางบันทึกผล (คัดลอกจากแล็บ)
  columns: [การผสม, อุณหภูมิสุดท้าย (°C), Q สูญเสีย กับ Q ได้รับ]
  rows: ["1 น้ำ 200 g 80 °C + น้ำ 300 g 20 °C", "2 น้ำ 100 g 70 °C + น้ำ 100 g 30 °C", "3 เหล็ก 100 g 100 °C + น้ำ 200 g 20 °C"]

questions:
  - q: ใช้สมการ m₁c₁(t₁ − t) = m₂c₂(t − t₂) คำนวณอุณหภูมิสุดท้ายของการผสมที่ 1 ตรงกับค่าในแล็บหรือไม่
    level: นำไปใช้
    lines: 3
    answer: "0.2 × {cv:water} × (80 − t) = 0.3 × {cv:water} × (t − 20) ได้ t = {calc:mixTwo:0.2:c.water:80:0.3:c.water:20|°C} ตรงกับแล็บ"
  - q: การผสมที่ 2 ได้ค่าเฉลี่ยของสองอุณหภูมิพอดี แต่การผสมที่ 1 ไม่ใช่ค่าเฉลี่ย เพราะเหตุใด
    level: เข้าใจ
    lines: 2
    answer: การผสมที่ 2 น้ำทั้งสองมีมวลและ c เท่ากัน อุณหภูมิสุดท้ายจึงอยู่กึ่งกลาง การผสมที่ 1 น้ำเย็นมีมวลมากกว่า อุณหภูมิสุดท้ายจึงใกล้ 20 °C มากกว่า
  - q: การผสมที่ 3 อุณหภูมิสุดท้ายใกล้ 20 °C มาก ทั้งที่เหล็กร้อนถึง 100 °C อธิบายโดยใช้ m และ c
    level: วิเคราะห์
    lines: 3
    answer: "m × c ของน้ำ (0.2 × {cv:water}) มากกว่าของเหล็ก (0.1 × {cv:iron}) มาก น้ำรับความร้อนเท่ากับที่เหล็กสูญเสียแต่อุณหภูมิเปลี่ยนน้อย ได้ t ≈ {calc:mixTwo:0.1:c.iron:100:0.2:c.water:20|°C}"

conclusion:
  lines: 2
  answer: ความร้อนถ่ายโอนจากสารร้อนไปสารเย็นจนอุณหภูมิเท่ากัน (สมดุลความร้อน) ถ้าไม่มีความร้อนสูญเสีย Q สูญเสีย = Q ได้รับ อุณหภูมิสุดท้ายขึ้นกับมวลและความจุความร้อนจำเพาะของสารทั้งสอง

rubric:
  - [บันทึกผลครบถูกต้อง, 3]
  - [คำนวณข้อ 1 ถูกต้อง, 3]
  - [ตอบคำถามโดยอ้างผลจากแล็บ, 4]
