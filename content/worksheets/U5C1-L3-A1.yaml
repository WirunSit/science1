# ใบกิจกรรมการทดลองจริง U5C1-L3-A1 (แผนข้อ 8.3) — ใช้อุปกรณ์ที่โรงเรียนมี (เครื่องแก้ว ชุดให้ความร้อน เทอร์โมมิเตอร์)
# ไม่มีลูกเหล็กกับห่วง จึงให้ดูฉากลูกโลหะกับห่วงใน Heat Lab แทน
id: U5C1-L3-A1
lesson: U5C1-L3
type: A
title: ใบกิจกรรม แก๊สและของเหลวขยายตัวเมื่อได้รับความร้อน
qr: clip

objectives:
  - ทดลองและสังเกตการขยายตัวและหดตัวของแก๊สและของเหลวเมื่อได้รับและสูญเสียความร้อน
  - อธิบายผลการทดลองด้วยแบบจำลองอนุภาค

inquiry:
  - label: คำถามการทดลอง
    lines: 1
    answer: เมื่อแก๊สและของเหลวได้รับความร้อนหรือสูญเสียความร้อน ปริมาตรจะเปลี่ยนไปอย่างไร
  - label: สมมติฐาน (ถ้า... ดังนั้น...)
    lines: 2
    answer: ถ้าแก๊สและของเหลวได้รับความร้อน ดังนั้นจะขยายตัว และถ้าสูญเสียความร้อนจะหดตัว
  - label: ตัวแปรต้น / ตัวแปรตาม / ตัวแปรควบคุม
    lines: 2
    answer: ต้น = อุณหภูมิของน้ำที่แช่ (ร้อน เย็น) / ตาม = ขนาดลูกโป่ง ระดับน้ำสีในหลอด / ควบคุม = ขวดใบเดิม ลูกโป่งใบเดิม ปริมาณน้ำสี เวลาที่แช่

materials:
  - [ขวดแก้วหรือขวดพลาสติกใส ขนาดเล็ก, 2 ใบ]
  - [ลูกโป่ง, 1 ใบ]
  - [จุกยางเจาะรูพร้อมหลอดแก้วหรือหลอดพลาสติกใส, 1 ชุด]
  - [น้ำผสมสีผสมอาหาร, ให้เต็มขวด 1 ใบ]
  - [บีกเกอร์ขนาดใหญ่หรือชาม, 2 ใบ]
  - [น้ำร้อน (ไม่เกิน 60 °C) และน้ำเย็นผสมน้ำแข็ง, อย่างละ 500 mL]
  - [เทอร์โมมิเตอร์, 1 อัน]

safety:
  - ครูเตรียมน้ำร้อนให้ ตรวจด้วยเทอร์โมมิเตอร์ว่าไม่เกิน 60 °C ก่อนใช้
  - จับขวดด้วยผ้าหรือที่จับ ห้ามจุ่มมือลงในน้ำร้อน
  - ระวังหลอดแก้วหักขณะเสียบจุก ให้ครูช่วยเสียบ ถ้าแตกให้แจ้งครู ห้ามเก็บเศษแก้วด้วยมือ

procedure:
  - สวมลูกโป่งที่ปากขวดเปล่าใบที่ 1 ให้แน่น วางในชามน้ำร้อน 2 นาที สังเกตลูกโป่ง
  - ย้ายขวดใบที่ 1 ไปวางในชามน้ำเย็น 2 นาที สังเกตลูกโป่ง
  - เติมน้ำสีให้เต็มขวดใบที่ 2 ปิดด้วยจุกที่มีหลอด ทำเครื่องหมายระดับน้ำสีในหลอด
  - วางขวดใบที่ 2 ในชามน้ำร้อน 2 นาที แล้วย้ายไปชามน้ำเย็น 2 นาที สังเกตระดับน้ำสีเทียบกับเครื่องหมาย
  - บันทึกผลลงตาราง และดูฉากลูกโลหะกับห่วงใน Heat Lab แทนการทดลองกับของแข็ง

table:
  caption: ตารางบันทึกผล สิ่งที่สังเกตได้
  columns: [สิ่งที่สังเกต, แช่น้ำร้อน, แช่น้ำเย็น]
  rows: [ลูกโป่งบนปากขวด (แก๊ส), ระดับน้ำสีในหลอด (ของเหลว), ลูกโลหะกับห่วงใน Heat Lab (ของแข็ง)]

draw:
  caption: วาดแบบจำลองอนุภาคของอากาศในขวด
  columns: [แช่น้ำเย็น, แช่น้ำร้อน]
  rows: [อนุภาคของอากาศ]
  answers:
    - [อนุภาคขนาดเท่าเดิม อยู่ใกล้กันกว่า ลูกศรสั้น, อนุภาคขนาดเท่าเดิม อยู่ห่างกันมากขึ้น ลูกศรยาว ลูกโป่งพอง]

questions:
  - q: เมื่อแช่น้ำร้อน ลูกโป่งและระดับน้ำสีเปลี่ยนไปอย่างไร
    level: จำ/เข้าใจ
    lines: 2
    answer: ลูกโป่งพองขึ้น ระดับน้ำสีในหลอดสูงขึ้น แสดงว่าแก๊สและของเหลวขยายตัวเมื่อได้รับความร้อน
  - q: ลูกโป่งพองขึ้นเพราะมีอากาศเข้าไปในขวดเพิ่ม หรือเพราะอากาศเดิมขยายตัว อธิบายด้วยแบบจำลองอนุภาค
    level: วิเคราะห์
    lines: 2
    answer: อากาศเดิมขยายตัว ปากขวดปิดด้วยลูกโป่ง จึงไม่มีอากาศเพิ่ม อนุภาคของอากาศได้รับความร้อน เคลื่อนที่เร็วขึ้นและอยู่ห่างกันมากขึ้น ปริมาตรจึงเพิ่ม มวลเท่าเดิม
  - q: การเปลี่ยนแปลงของลูกโป่งกับน้ำสี อย่างไหนเห็นชัดกว่ากัน บอกอะไรเกี่ยวกับการขยายตัวของแก๊สกับของเหลว
    level: วิเคราะห์
    lines: 2
    answer: ลูกโป่งเปลี่ยนชัดกว่า แก๊สขยายตัวได้มากกว่าของเหลว (ของเหลวต้องใช้หลอดเล็กจึงจะเห็นการเปลี่ยนระดับ)

conclusion:
  lines: 2
  answer: แก๊สและของเหลวขยายตัวเมื่อได้รับความร้อนและหดตัวเมื่อสูญเสียความร้อน เพราะระยะห่างระหว่างอนุภาคเปลี่ยน โดยแก๊สขยายตัวได้มากกว่าของเหลว

rubric:
  - [ตั้งคำถาม สมมติฐาน และตัวแปรถูกต้อง, 3]
  - [บันทึกผลครบและวาดแบบจำลองอนุภาคถูกต้อง, 4]
  - [ตอบคำถามโดยใช้ผลการทดลองและแบบจำลองอนุภาค, 2]
  - [ปฏิบัติตามข้อควรระวังด้านความปลอดภัย, 1]
