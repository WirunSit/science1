# ใบกิจกรรมการทดลองจริง U5C2-L3-A1 (แผนข้อ 9.3) — ผสมน้ำร้อนกับน้ำเย็น 3 ชุด คำนวณทำนายก่อน แล้ววัดจริง
# แนวคำตอบในฉบับครูเป็นตัวอย่างเมื่อน้ำร้อน 60 °C และน้ำเย็น 30 °C (ค่าจริงขึ้นกับที่กลุ่มวัดได้)
id: U5C2-L3-A1
lesson: U5C2-L3
type: A
title: ใบกิจกรรม ทำนายอุณหภูมิผสมด้วยการคำนวณ แล้ววัดจริง
qr: clip

objectives:
  - คำนวณอุณหภูมิผสมด้วย Q สูญเสีย = Q ได้รับ ก่อนทดลอง
  - เปรียบเทียบค่าที่วัดได้กับค่าที่คำนวณ และอธิบายสาเหตุที่ต่างกัน
  - "ใช้ c ของน้ำ = {c:water} และถือว่าน้ำ 1 mL มีมวลประมาณ 1 g"

inquiry:
  - label: คำถามการทดลอง
    lines: 1
    answer: อุณหภูมิผสมที่วัดได้จริงตรงกับค่าที่คำนวณจาก Q สูญเสีย = Q ได้รับ หรือไม่
  - label: สมมติฐาน (ถ้า... ดังนั้น...)
    lines: 2
    answer: ถ้ามีความร้อนบางส่วนสูญเสียให้ภาชนะและอากาศ ดังนั้นอุณหภูมิที่วัดได้จะต่ำกว่าค่าที่คำนวณเล็กน้อย

materials:
  - [แก้วโฟมหรือบีกเกอร์ขนาด 250 mL, 3 ใบ]
  - [กระบอกตวงขนาด 100 mL, 2 ใบ]
  - [น้ำร้อนไม่เกิน 70 °C (ครูเตรียม), 400 mL]
  - [น้ำที่อุณหภูมิห้อง, 400 mL]
  - [เทอร์โมมิเตอร์, 2 อัน]
  - [แท่งแก้วคน, 1 อัน]

safety:
  - ครูเป็นผู้เตรียมน้ำร้อน ใช้น้ำไม่เกิน 70 °C ใช้ที่จับเมื่อยกภาชนะน้ำร้อน
  - ห้ามใช้เทอร์โมมิเตอร์คนน้ำ ใช้แท่งแก้วคนแทน
  - ถ้าน้ำร้อนหกให้แจ้งครูและเช็ดทันที

procedure:
  - วัดอุณหภูมิของน้ำร้อนและน้ำเย็นก่อนผสม บันทึกในตาราง
  - คำนวณอุณหภูมิผสมที่ทำนายของทั้ง 3 ชุดก่อนผสม (เขียนวิธีคิดในข้อ 1)
  - ผสมชุดที่ 1 ตวงน้ำร้อนและน้ำเย็นตามตาราง เทน้ำร้อนลงในน้ำเย็น คนเบา ๆ แล้วอ่านอุณหภูมิสูงสุดที่คงที่
  - ทำชุดที่ 2 และ 3 ด้วยภาชนะใบใหม่ แล้วหาผลต่างของค่าที่วัดได้กับค่าที่ทำนาย

table:
  caption: ตารางบันทึกผล อุณหภูมิผสม
  columns: [ชุด, "น้ำร้อน (g, °C)", "น้ำเย็น (g, °C)", ทำนาย (°C), วัดได้ (°C)]
  rows: ["1 (ร้อน 100 g + เย็น 100 g)", "2 (ร้อน 100 g + เย็น 200 g)", "3 (ร้อน 200 g + เย็น 100 g)"]

questions:
  - q: เขียนวิธีคำนวณอุณหภูมิผสมที่ทำนายของชุดที่ 2 ด้วย m₁c₁(t₁ − t) = m₂c₂(t − t₂)
    level: นำไปใช้
    lines: 3
    answer: "ตัวอย่าง น้ำร้อน 60 °C น้ำเย็น 30 °C: 0.1 × {cv:water} × (60 − t) = 0.2 × {cv:water} × (t − 30) ได้ t = {calc:mixTwo:0.1:c.water:60:0.2:c.water:30|°C} (ชุดที่ 1 = {calc:mixTwo:0.1:c.water:60:0.1:c.water:30|°C}, ชุดที่ 3 = {calc:mixTwo:0.2:c.water:60:0.1:c.water:30|°C})"
  - q: อุณหภูมิผสมชุดใดใกล้อุณหภูมิน้ำเย็นมากที่สุด เพราะเหตุใด
    level: เข้าใจ
    lines: 2
    answer: ชุดที่ 2 เพราะน้ำเย็นมีมวลมากกว่าน้ำร้อน อุณหภูมิผสมจึงอยู่ใกล้อุณหภูมิของน้ำที่มีมวลมากกว่า
  - q: ค่าที่วัดได้สูงกว่าหรือต่ำกว่าค่าที่ทำนาย บอกสาเหตุ 2 ข้อ และวิธีทำให้ค่าใกล้กันมากขึ้น
    level: วิเคราะห์
    lines: 3
    answer: มักต่ำกว่าเล็กน้อย เพราะความร้อนสูญเสียให้อากาศและภาชนะ และเทอร์โมมิเตอร์ดูดความร้อน วิธีแก้ ใช้แก้วโฟม ปิดฝา คนให้ทั่วและอ่านค่าเร็ว

conclusion:
  lines: 2
  answer: น้ำร้อนถ่ายโอนความร้อนให้น้ำเย็นจนอุณหภูมิเท่ากัน ค่าที่วัดได้ใกล้กับค่าที่คำนวณจาก Q สูญเสีย = Q ได้รับ แต่ต่ำกว่าเล็กน้อยเพราะมีความร้อนสูญเสียสู่สิ่งแวดล้อม

rubric:
  - [คำนวณค่าทำนายก่อนทดลองถูกต้อง, 3]
  - [บันทึกผลครบ มีหน่วย, 3]
  - [อธิบายความแตกต่างของค่าที่วัดกับค่าที่คำนวณได้, 3]
  - [ปฏิบัติตามข้อควรระวังด้านความปลอดภัย, 1]
