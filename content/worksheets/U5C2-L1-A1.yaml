# ใบกิจกรรมการทดลองจริง U5C2-L1-A1 (แผนข้อ 9.1) — วัสดุต่างชนิดติดเทียนไข จับเวลาที่เทียนหลุด
# ใช้ของที่หาได้ในโรงเรียน (ช้อนโลหะ ลวดทองแดง ตะเกียบไม้ ช้อนพลาสติก) ครูควรทดลองก่อนว่าน้ำร้อนที่ใช้ละลายเทียนได้
id: U5C2-L1-A1
lesson: U5C2-L1
type: A
title: ใบกิจกรรม วัสดุใดนำความร้อนได้ดี
qr: clip

objectives:
  - ทดลองเปรียบเทียบการนำความร้อนของวัสดุต่างชนิด
  - จำแนกวัสดุเป็นตัวนำความร้อนหรือฉนวนความร้อนจากผลการทดลอง

inquiry:
  - label: คำถามการทดลอง
    lines: 1
    answer: วัสดุต่างชนิดนำความร้อนได้ดีเท่ากันหรือไม่
  - label: สมมติฐาน (ถ้า... ดังนั้น...)
    lines: 2
    answer: ถ้าวัสดุเป็นโลหะ ดังนั้นความร้อนจะผ่านไปถึงเทียนได้เร็ว เทียนจะหลุดเร็วกว่าวัสดุที่เป็นไม้หรือพลาสติก
  - label: ตัวแปรต้น / ตัวแปรตาม
    lines: 1
    answer: ตัวแปรต้น ชนิดของวัสดุ / ตัวแปรตาม เวลาที่เทียนแต่ละเม็ดหลุด
  - label: ตัวแปรควบคุม
    lines: 1
    answer: ขนาดเม็ดเทียน ระยะห่างของเม็ดเทียน ความยาวส่วนที่จุ่มน้ำ อุณหภูมิของน้ำร้อน

materials:
  - [ช้อนโลหะ ลวดทองแดงเส้นใหญ่ ตะเกียบไม้ ช้อนพลาสติก ยาวใกล้เคียงกัน, อย่างละ 1 ชิ้น]
  - [เทียนไข (ขูดเป็นเม็ดเล็กขนาดเท่ากัน), 1 เล่ม]
  - [บีกเกอร์ขนาด 250 mL, 1 ใบ]
  - [น้ำร้อนจัด (ครูเป็นผู้เท), 200 mL]
  - [ไม้บรรทัด, 1 อัน]
  - [นาฬิกาจับเวลา (ใช้โทรศัพท์ได้), 1 เครื่อง]

safety:
  - ครูเป็นผู้เทน้ำร้อนจัด นักเรียนห้ามยกบีกเกอร์น้ำร้อน
  - ห้ามจับปลายวัสดุที่จุ่มน้ำร้อน วัสดุโลหะร้อนมาก ใช้ที่คีบเมื่อหยิบออก
  - วางบีกเกอร์บนโต๊ะที่มั่นคง ห่างจากขอบโต๊ะ

procedure:
  - ติดเม็ดเทียนบนวัสดุแต่ละชิ้น 3 เม็ด ห่างจากปลายที่จะจุ่มน้ำ 3 cm, 6 cm และ 9 cm (กดเม็ดเทียนที่อุ่นเล็กน้อยให้ติด)
  - ตั้งวัสดุทั้ง 4 ชิ้นในบีกเกอร์เปล่าพร้อมกัน ให้ปลายแตะก้นบีกเกอร์และเม็ดเทียนอยู่ด้านนอก
  - ครูเทน้ำร้อนลงในบีกเกอร์ เริ่มจับเวลาทันที
  - สังเกตและบันทึกเวลาที่เทียนแต่ละเม็ดหลุด จนครบ 10 นาที ถ้าไม่หลุดให้เขียน "ไม่หลุด"

table:
  caption: ตารางบันทึกผล เวลาที่เทียนหลุด (s)
  columns: [วัสดุ, เม็ดที่ 1 (3 cm), เม็ดที่ 2 (6 cm), เม็ดที่ 3 (9 cm), ตัวนำ/ฉนวน]
  rows: [ช้อนโลหะ, ลวดทองแดง, ตะเกียบไม้, ช้อนพลาสติก]

questions:
  - q: เทียนบนวัสดุใดหลุดเร็วที่สุด และวัสดุใดเทียนไม่หลุดเลย
    level: จำ/เข้าใจ
    lines: 2
    answer: ลวดทองแดงหรือช้อนโลหะเทียนหลุดเร็วที่สุด (ตามผลของกลุ่ม) ตะเกียบไม้และช้อนพลาสติกเทียนไม่หลุดภายใน 10 นาที
  - q: ทำไมเทียนเม็ดที่ 1 จึงหลุดก่อนเม็ดที่ 3 บนวัสดุชิ้นเดียวกัน อธิบายด้วยการสั่นของอนุภาค
    level: เข้าใจ
    lines: 2
    answer: เม็ดที่ 1 อยู่ใกล้น้ำร้อนกว่า อนุภาคที่ปลายร้อนสั่นแรงขึ้นแล้วส่งต่อพลังงานให้อนุภาคข้างเคียงทีละต่อ ความร้อนจึงไปถึงเม็ดที่ 1 ก่อน
  - q: ถ้าจะทำทัพพีตักแกงร้อน ควรเลือกวัสดุจากการทดลองนี้ทำส่วนใด เพราะเหตุใด
    level: นำไปใช้
    lines: 2
    answer: ส่วนตักใช้โลหะได้ แต่ด้ามจับควรเป็นไม้หรือพลาสติกซึ่งเป็นฉนวนความร้อน มือจะไม่ร้อน

conclusion:
  lines: 2
  answer: วัสดุต่างชนิดนำความร้อนได้ไม่เท่ากัน โลหะเป็นตัวนำความร้อน ไม้และพลาสติกเป็นฉนวนความร้อน

rubric:
  - [ระบุตัวแปรถูกต้อง, 2]
  - [บันทึกผลครบ มีหน่วย, 3]
  - [ตอบคำถามโดยใช้ผลการทดลอง, 4]
  - [ปฏิบัติตามข้อควรระวังด้านความปลอดภัย, 1]
