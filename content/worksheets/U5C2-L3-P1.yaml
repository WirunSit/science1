# ใบงานฝึกทักษะ U5C2-L3-P1 (แผนข้อ 9.3) — คำนวณสมดุลความร้อน 8 ข้อ 3 ระดับ (ไม่มีการเปลี่ยนสถานะ)
# คำตอบทุกข้อคำนวณด้วย mixTwo จาก constants ข้อ 7–8 ใช้ c ของอะลูมิเนียมและทองแดง ซึ่งยัง verified:false — ครูตรวจก่อนแจก
id: U5C2-L3-P1
lesson: U5C2-L3
type: P
title: ใบงาน คำนวณสมดุลความร้อน
qr: clip

objectives:
  - คำนวณอุณหภูมิสุดท้ายด้วย m₁c₁(t₁ − t) = m₂c₂(t − t₂) เมื่อไม่มีความร้อนสูญเสีย
  - "ใช้ c ของน้ำ = {c:water}, c ของอะลูมิเนียม = {c:aluminium}, c ของทองแดง = {c:copper} ตอบทศนิยม 1 ตำแหน่ง"

questions:
  - section: ระดับ 1 น้ำผสมน้ำ มวลเท่ากัน
    q: น้ำ 0.2 kg ที่ 90 °C ผสมกับน้ำ 0.2 kg ที่ 30 °C อุณหภูมิสุดท้ายเท่าใด
    level: นำไปใช้
    lines: 2
    answer: "0.2 × c × (90 − t) = 0.2 × c × (t − 30) ได้ t = {calc:mixTwo:0.2:c.water:90:0.2:c.water:30|°C}"
  - q: น้ำ 150 g ที่ 80 °C ผสมกับน้ำ 150 g ที่ 20 °C อุณหภูมิสุดท้ายเท่าใด
    level: นำไปใช้
    lines: 2
    answer: "มวลเท่ากัน t อยู่กึ่งกลาง t = {calc:mixTwo:0.15:c.water:80:0.15:c.water:20|°C}"
  - section: ระดับ 2 น้ำผสมน้ำ มวลต่างกัน
    q: น้ำ 0.1 kg ที่ 80 °C ผสมกับน้ำ 0.3 kg ที่ 20 °C อุณหภูมิสุดท้ายเท่าใด
    level: นำไปใช้
    lines: 3
    answer: "0.1 × {cv:water} × (80 − t) = 0.3 × {cv:water} × (t − 20) ได้ t = {calc:mixTwo:0.1:c.water:80:0.3:c.water:20|°C}"
  - q: น้ำ 0.4 kg ที่ 50 °C ผสมกับน้ำ 0.1 kg ที่ 100 °C อุณหภูมิสุดท้ายเท่าใด
    level: นำไปใช้
    lines: 3
    answer: "0.1 × {cv:water} × (100 − t) = 0.4 × {cv:water} × (t − 50) ได้ t = {calc:mixTwo:0.4:c.water:50:0.1:c.water:100|°C}"
  - q: น้ำ 300 g ที่ 70 °C ผสมกับน้ำ 200 g ที่ 20 °C อุณหภูมิสุดท้ายเท่าใด
    level: นำไปใช้
    lines: 3
    answer: "0.3 × {cv:water} × (70 − t) = 0.2 × {cv:water} × (t − 20) ได้ t = {calc:mixTwo:0.3:c.water:70:0.2:c.water:20|°C}"
  - q: เพื่อนบอกว่า "ผสมน้ำ 80 °C กับน้ำ 20 °C ได้ 50 °C เสมอ" ถูกหรือไม่ ใช้คำตอบข้อ 3 อธิบาย
    level: วิเคราะห์
    lines: 2
    answer: "ไม่ถูก ได้ 50 °C เฉพาะเมื่อมวลเท่ากัน ข้อ 3 น้ำเย็นมีมวลมากกว่า ได้ {calc:mixTwo:0.1:c.water:80:0.3:c.water:20|°C}"
  - section: ระดับ 3 โลหะใส่ในน้ำ
    q: ก้อนอะลูมิเนียม 0.2 kg ที่ 100 °C ใส่ลงในน้ำ 0.5 kg ที่ 25 °C อุณหภูมิสุดท้ายเท่าใด
    level: วิเคราะห์
    lines: 3
    answer: "0.2 × {cv:aluminium} × (100 − t) = 0.5 × {cv:water} × (t − 25) ได้ t ≈ {calc:mixTwo:0.2:c.aluminium:100:0.5:c.water:25|°C}"
  - q: ก้อนทองแดง 0.1 kg ที่ 90 °C ใส่ลงในน้ำ 0.1 kg ที่ 20 °C อุณหภูมิสุดท้ายเท่าใด ทำไมจึงใกล้ 20 °C
    level: วิเคราะห์
    lines: 3
    answer: "0.1 × {cv:copper} × (90 − t) = 0.1 × {cv:water} × (t − 20) ได้ t ≈ {calc:mixTwo:0.1:c.copper:90:0.1:c.water:20|°C} ใกล้ 20 °C เพราะ c ของน้ำมากกว่าทองแดงมาก"

rubric:
  - [ระดับ 1 ข้อละ 1 คะแนน, 2]
  - [ระดับ 2 ข้อละ 2 คะแนน (ตั้งสมการถูก 1 คำนวณถูก 1), 8]
  - [ระดับ 3 ข้อละ 2 คะแนน, 4]
