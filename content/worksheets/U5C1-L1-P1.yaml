# ใบงานฝึกทักษะ U5C1-L1-P1 (แผนข้อ 8.1) — แยก "ความร้อน" กับ "อุณหภูมิ" จากสถานการณ์ 6 ข้อ
# สถานการณ์เขียนขึ้นเองจากชีวิตประจำวันของนักเรียน ไม่คัดลอกจากหนังสือเรียน
id: U5C1-L1-P1
lesson: U5C1-L1
type: P
title: ใบงาน ความร้อนหรืออุณหภูมิ
qr: clip

objectives:
  - แยกความหมายของความร้อน (พลังงานที่ถ่ายโอน หน่วย J) กับอุณหภูมิ (ระดับความร้อน วัดด้วยเทอร์โมมิเตอร์ หน่วย °C)
  - อธิบายสถานการณ์ในชีวิตประจำวันด้วยการถ่ายโอนความร้อนและแบบจำลองอนุภาค

questions:
  - section: "ตอนที่ 1 ข้อความต่อไปนี้พูดถึง \"ความร้อน\" หรือ \"อุณหภูมิ\" พร้อมบอกเหตุผล"
    q: "\"วันนี้ร้อนมาก กรมอุตุนิยมวิทยารายงานว่าสูงถึง 38 °C\" ตัวเลข 38 °C บอกอะไร"
    level: จำ
    lines: 1
    answer: อุณหภูมิ เพราะเป็นค่าที่วัดด้วยเทอร์โมมิเตอร์ มีหน่วยองศาเซลเซียส
  - q: "\"แม่ต้มน้ำบนเตาแก๊ส จนน้ำเดือด\" เตาแก๊สให้อะไรแก่น้ำ"
    level: เข้าใจ
    lines: 1
    answer: ความร้อน เพราะเป็นพลังงานที่ถ่ายโอนจากเปลวไฟไปยังน้ำ ทำให้อุณหภูมิของน้ำสูงขึ้น
  - q: "\"พยาบาลวัดไข้ได้ 37.5 °C\" ตัวเลขนี้คือความร้อนหรืออุณหภูมิ"
    level: จำ
    lines: 1
    answer: อุณหภูมิของร่างกาย วัดด้วยเทอร์โมมิเตอร์วัดไข้
  - section: ตอนที่ 2 อธิบายสถานการณ์ด้วยการถ่ายโอนความร้อนและแบบจำลองอนุภาค
    q: วางน้ำแข็งก้อนหนึ่งไว้ในแก้วน้ำ น้ำแข็งละลายและน้ำเย็นลง เกิดอะไรขึ้นกับความร้อน
    level: เข้าใจ
    lines: 2
    answer: ความร้อนถ่ายโอนจากน้ำ (อุณหภูมิสูงกว่า) ไปยังน้ำแข็ง น้ำจึงเย็นลงและน้ำแข็งละลาย ไม่ใช่ความเย็นไหลจากน้ำแข็งไปยังน้ำ
  - q: จับช้อนโลหะที่แช่ในแกงร้อน ๆ แล้วรู้สึกร้อนมือ ความร้อนถ่ายโอนจากที่ใดไปที่ใด
    level: นำไปใช้
    lines: 2
    answer: จากแกง (อุณหภูมิสูง) ไปยังช้อน แล้วจากช้อนไปยังมือ (อุณหภูมิต่ำกว่า)
  - q: ใช้แบบจำลองอนุภาคอธิบายว่า เมื่อให้ความร้อนแก่น้ำ ทำไมเทอร์โมมิเตอร์จึงอ่านค่าได้สูงขึ้น
    level: วิเคราะห์
    lines: 3
    answer: เมื่อน้ำได้รับความร้อน อนุภาคของน้ำเคลื่อนที่เร็วขึ้น อุณหภูมิของน้ำจึงสูงขึ้น เทอร์โมมิเตอร์ที่จุ่มอยู่ได้รับความร้อนจากน้ำ ของเหลวในหลอดจึงขยายตัวขึ้นไปอ่านค่าได้สูงขึ้น

rubric:
  - [ตอนที่ 1 ตอบถูกพร้อมเหตุผล ข้อละ 1 คะแนน, 3]
  - [ตอนที่ 2 อธิบายทิศทางการถ่ายโอนความร้อนถูกต้อง ข้อ 4–5 ข้อละ 2 คะแนน, 4]
  - [ข้อ 6 ใช้แบบจำลองอนุภาคอธิบายได้ถูกต้อง, 3]
